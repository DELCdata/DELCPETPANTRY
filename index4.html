.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}

.flex{display:flex}.flex-col{flex-direction:column}.gap-2{gap:8px}.gap-3{gap:12px}.gap-4{gap:16px}
.items-center{align-items:center}.justify-between{justify-content:space-between}
.mt-2{margin-top:8px}.mt-3{margin-top:12px}.mt-4{margin-top:16px}
.mb-2{margin-bottom:8px}.mb-3{margin-bottom:12px}.mb-4{margin-bottom:16px}
.text-sm{font-size:13px}.text-xs{font-size:11px}.text-muted{color:var(--gray-400)}
.text-right{text-align:right}.font-bold{font-weight:700}.w-full{width:100%}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}

.empty-state .icon{font-size:48px;margin-bottom:12px}

.login-page{min-height:100vh;background:var(--navy-dark);display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:var(--white);border-radius:16px;box-shadow:0 8px 40px rgba(0,0,0,.4);padding:40px;width:100%;max-width:420px}

.login-logo h1{color:var(--navy);font-size:22px;font-weight:800;margin-bottom:4px}

.login-error{background:var(--red-light);border:1px solid var(--red);color:var(--red);padding:10px 14px;border-radius:var(--radius);font-size:13px;margin-bottom:16px;text-align:center}

@media(max-width:900px){
  .sidebar{width:56px}
  .sidebar-logo-text,.sidebar-logo-sub,.sidebar-section-label,.nav-item span{display:none}
  .nav-item{justify-content:center;padding:12px}
  .main{margin-left:56px}
  .grid-4{grid-template-columns:1fr 1fr}

}
@media(max-width:600px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}.page{padding:14px}}
.search-bar{display:flex;gap:10px;margin-bottom:16px}
.search-bar .form-control{flex:1}
.qty-controls{display:flex;align-items:center;gap:6px}
.qty-btn{width:30px;height:30px;border:1.5px solid var(--gray-200);border-radius:6px;background:var(--white);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--gray-600)}
.qty-btn:hover{background:var(--gray-100)}
.qty-num{width:50px;text-align:center;border:1.5px solid var(--gray-200);border-radius:6px;padding:5px;font-size:15px;font-weight:700}
.product-img{width:40px;height:40px;border-radius:6px;object-fit:contain;background:var(--gray-50);border:1px solid var(--gray-200)}
.tabs{display:flex;gap:2px;background:var(--gray-100);padding:4px;border-radius:var(--radius);margin-bottom:16px}
.tab{flex:1;padding:8px;text-align:center;border:none;background:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;color:var(--gray-600);transition:all .15s}
.tab.active{background:var(--white);color:var(--navy);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.client-card{background:var(--white);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:16px;cursor:pointer;transition:box-shadow .15s;border:1.5px solid transparent}
.client-card:hover{box-shadow:var(--shadow-lg);border-color:var(--navy)}
.client-avatar{width:42px;height:42px;border-radius:50%;background:var(--navy);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;flex-shrink:0}
.batch-line{display:flex;align-items:center;gap:10px;padding:10px;border:1.5px solid var(--gray-200);border-radius:var(--radius);margin-bottom:8px;background:var(--white)}
.report-filter-bar{background:var(--white);border-radius:var(--radius);padding:14px;margin-bottom:16px;display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;box-shadow:var(--shadow)}
</style>

<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback,useMemo}=React;

// ── SUPABASE ──────────────────────────────────────────────────────────────────
const SUPABASE_URL='https://hmkyzdivvkxwlagnjfeu.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhta3l6ZGl2dmt4d2xhZ25qZmV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1MTk4MzMsImV4cCI6MjA5ODA5NTgzM30.Y-X8jO-qHwhGwRWI5i0Pzgo3bO3msFxUqmPx81X2-RM';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

// DB helpers
function rowToProduct(r){return{id:r.id,upc:r.upc||'',name:r.name,brand:r.brand||'',size:r.size||'',animalType:r.animal_type,category:r.category,image:r.image||'',notes:r.notes||''};}
function productToRow(p){return{id:p.id,upc:p.upc,name:p.name,brand:p.brand,size:p.size,animal_type:p.animalType,category:p.category,image:p.image,notes:p.notes};}
function rowToInventory(r){return{id:r.id,productId:r.product_id,qty:r.qty};}
function rowToClient(r,pets,resources){return{id:r.id,firstName:r.first_name,lastName:r.last_name,phone:r.phone||'',email:r.email||'',address:r.address||'',notes:r.notes||'',pets:pets||[],resources:resources||[]};}
function rowToPet(r){return{id:r.id,clientId:r.client_id,name:r.name,animalType:r.animal_type||'Cat',breed:r.breed||'',age:r.age||'',specialNotes:r.special_notes||'',foodPref:r.food_pref||''};}
function rowToResource(r){return{id:r.id,clientId:r.client_id,type:r.type||'Food',date:r.date||'',phone:r.phone||'',notes:r.notes||'',offered:r.offered||'',status:r.status||null};}
function rowToBatch(r,items){return{id:r.id,date:r.date,donor:r.donor||'',status:r.status,notes:r.notes||'',items:items||[]};}
function rowToBatchItem(r){return{productId:r.product_id,qty:r.qty,notes:r.notes||''};}
function rowToDistribution(r,items){return{id:r.id,clientId:r.client_id,date:r.date,notes:r.notes||'',items:items||[]};}
function rowToDistItem(r){return{productId:r.product_id,qty:r.qty,notes:r.notes||''};}
function rowToAdj(r){return{id:r.id,productId:r.product_id,date:r.date,qty:r.qty,reason:r.reason||'',notes:r.notes||'',adjBy:r.adj_by||''};}
function rowToRequest(r,items){return{id:r.id,clientId:r.client_id,date:r.date,status:r.status,method:r.method||'',notes:r.notes||'',createdBy:r.created_by||'',createdAt:r.created_at,fulfilledAt:r.fulfilled_at,distributionId:r.distribution_id,items:items||[]};}
function rowToRequestItem(r){return{petName:r.pet_name||'',animalType:r.animal_type||'',category:r.category||'',description:r.description||'',qtyRequested:r.qty_requested!==null&&r.qty_requested!==undefined?Number(r.qty_requested):null};}
function rowToLedger(r){return{id:r.id,date:r.date,type:r.type,category:r.category||'',description:r.description||'',amount:Number(r.amount),vendor:r.vendor||'',donatedBy:r.donated_by||'',paymentMethod:r.payment_method||'',receiptNumber:r.receipt_number||'',notes:r.notes||'',createdBy:r.created_by||''};}

// ── CONSTANTS ─────────────────────────────────────────────────────────────────
const ANIMAL_TYPES=['Cat','Dog','Other'];
const CAT_CATEGORIES=['Wet Food','Dry Food','Litter','Accessories'];
const DOG_CATEGORIES=['Wet Food','Dry Food','Accessories'];
const OTHER_CATEGORIES=['Bird','Small Animal','Reptile','Fish','Farm Animal','Other'];
const LEDGER_EXPENSE_CATS=['Pet Food','Litter','Supplies','Veterinary','Transportation','Printing','Event','Other'];
const LEDGER_DEPOSIT_CATS=['Donation','Church Offering','Grant','Fundraiser','Memorial Gift','In-Kind','Other'];
const PAYMENT_METHODS=['Cash','Check','Credit Card','Debit Card','Venmo','PayPal','Zelle','Bank Transfer','Other'];
const ACCESSORY_TYPES=['Collars','Leashes','Harnesses','Litter Pans','Bowls','Toys','Treats','Beds','Crates','Grooming Supplies','Miscellaneous Accessories'];
const ADJ_REASONS=['Physical Count','Damaged','Expired','Giveaway','Correction','Other'];
const REQUEST_METHODS=['Business Hours Pickup','Drop Box','Either / Not Sure'];
const LOW_STOCK_THRESHOLD=5;

// ── RESOURCE CONSTANTS ────────────────────────────────────────────────────────
const RESOURCE_TYPES=['Food','Clothing','Home/Motel','Money','Gift Card','Cash'];
const RESOURCE_ICON={Food:'🍲',Clothing:'👕','Home/Motel':'🏠',Money:'💵','Gift Card':'🎁',Cash:'💰'};
const RESOURCE_COLOR={Food:'#d97706',Clothing:'#7c3aed','Home/Motel':'#0891b2',Money:'#2d7a4f','Gift Card':'#c0392b',Cash:'#10b981'};

function getCatsForAnimal(type){
  if(type==='Cat') return CAT_CATEGORIES;
  if(type==='Dog') return DOG_CATEGORIES;
  return OTHER_CATEGORIES;
}

// ── STORAGE ───────────────────────────────────────────────────────────────────
const LS={
  get:(k,def)=>{try{const v=localStorage.getItem('delc_pp_'+k);return v?JSON.parse(v):def}catch{return def}},
  set:(k,v)=>{try{localStorage.setItem('delc_pp_'+k,JSON.stringify(v))}catch{}}
};

// ── UTILITIES ─────────────────────────────────────────────────────────────────
const uid=()=>Math.random().toString(36).slice(2,10);
const today=()=>new Date().toISOString().slice(0,10);
const fmtDate=d=>d?new Date(d+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'—';
const fmtDatetime=d=>d?new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';

function animalBadge(type){
  const cls=type==='Cat'?'badge-cat':type==='Dog'?'badge-dog':'badge-other';
  const ico=type==='Cat'?'🐱':type==='Dog'?'🐶':'🐾';
  return <span className={`badge ${cls}`}>{ico} {type}</span>;
}
function stockBadge(qty){
  if(qty===0) return <span className="badge badge-out">Out of Stock</span>;
  if(qty<=LOW_STOCK_THRESHOLD) return <span className="badge badge-low">Low Stock</span>;
  return <span className="badge badge-good">In Stock</span>;
}
function exportCSV(rows,cols,filename){
  const lines=[cols.map(c=>c.label).join(','),...rows.map(r=>cols.map(c=>`"${(r[c.key]??'').toString().replace(/"/g,'""')}"`).join(','))];
  const blob=new Blob([lines.join('\n')],{type:'text/csv'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename+'.csv';a.click();
  URL.revokeObjectURL(url);
}

// ── UPC LOOKUP ────────────────────────────────────────────────────────────────
async function lookupUPC(upc){
  try{const r=await fetch('https://world.openpetfoodfacts.org/api/v0/product/'+upc+'.json');const d=await r.json();if(d.status===1&&d.product){const p=d.product;const name=p.product_name||p.product_name_en||'';if(name)return{upc,name,brand:p.brands||'',size:p.quantity||p.net_weight_value||'',image:p.image_front_small_url||p.image_url||'',found:true,source:'Open Pet Food Facts'};}}catch(e){}
  try{const r=await fetch('https://world.openfoodfacts.org/api/v0/product/'+upc+'.json');const d=await r.json();if(d.status===1&&d.product){const p=d.product;const name=p.product_name||p.product_name_en||'';if(name)return{upc,name,brand:p.brands||'',size:p.quantity||'',image:p.image_front_small_url||'',found:true,source:'Open Food Facts'};}}catch(e){}
  try{const r=await fetch('https://api.upcitemdb.com/prod/trial/lookup?upc='+upc);const d=await r.json();if(d.items&&d.items.length){const it=d.items[0];const name=it.title||it.description||'';if(name)return{upc,name,brand:it.brand||'',size:it.size||it.weight||'',image:it.images?.[0]||'',found:true,source:'UPCitemDB'};}}catch(e){}
  try{const r=await fetch('https://www.datakick.org/api/items/'+upc);const d=await r.json();if(d&&d.name)return{upc,name:d.name||'',brand:d.brand_name||'',size:d.size||'',image:d.images?.[0]?.url||'',found:true,source:'Datakick'};}catch(e){}
  return{upc,found:false};
}

function Modal({show,onClose,title,children,footer,wide}){

    <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose()}}>
      <div className="modal" style={wide?{maxWidth:820}:{}}>

        </div>
        <div className="modal-body">{children}</div>
        {footer&&<div className="modal-footer">{footer}</div>}

// ── DASHBOARD ─────────────────────────────────────────────────────────────────
function Dashboard({products,inventory,batches,distributions,adjustments,clients,navigate}){
  const inv=useMemo(()=>{const m={};inventory.forEach(i=>m[i.productId]=i.qty);return m;},[inventory]);
  const cats=products.filter(p=>p.animalType==='Cat');
  const dogs=products.filter(p=>p.animalType==='Dog');
  const catQty=cats.reduce((s,p)=>s+(inv[p.id]||0),0);
  const dogQty=dogs.reduce((s,p)=>s+(inv[p.id]||0),0);
  const totalQty=inventory.reduce((s,i)=>s+i.qty,0);
  const pendingBatches=batches.filter(b=>b.status==='pending');

  // Category-level stock alerts only (no individual item noise)
  const stockAlerts=useMemo(()=>{
    const result=[];
    [...CAT_CATEGORIES.map(c=>({label:`Cat ${c}`,animal:'Cat',cat:c})),...DOG_CATEGORIES.map(c=>({label:`Dog ${c}`,animal:'Dog',cat:c}))].forEach(({label,animal,cat})=>{
      const prods=products.filter(p=>p.animalType===animal&&p.category===cat);
      if(prods.length>0){
        const qty=prods.reduce((s,p)=>s+(inv[p.id]||0),0);
        if(qty===0) result.push({label,level:'out',qty:0});
        else if(qty<=10) result.push({label,level:'low',qty});
      }
    });
    return result;
  },[products,inv]);

  // People helped by time period
  const now=new Date();
  const daysAgo=(n)=>{const d=new Date(now);d.setDate(d.getDate()-n);return d.toISOString().slice(0,10);};
  const ytdStart=`${now.getFullYear()}-01-01`;
  const helpedIn=(from)=>new Set(distributions.filter(d=>d.date>=from).map(d=>d.clientId)).size;
  const helped7=helpedIn(daysAgo(7));
  const helped30=helpedIn(daysAgo(30));
  const helped60=helpedIn(daysAgo(60));
  const helped90=helpedIn(daysAgo(90));
  const helpedYTD=helpedIn(ytdStart);

  // Pet type counts
  const petCounts={Cat:0,Dog:0,Other:0};
  clients.forEach(c=>(c.pets||[]).forEach(p=>{petCounts[p.animalType]=(petCounts[p.animalType]||0)+1;}));
  const totalPets=Object.values(petCounts).reduce((s,v)=>s+v,0);

  // Resource request counts
  const resCounts={};
  clients.forEach(c=>(c.resources||[]).forEach(r=>{resCounts[r.type]=(resCounts[r.type]||0)+1;}));
  const totalRes=Object.values(resCounts).reduce((s,v)=>s+v,0);

  const recentBatches=[...batches].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
  const recentDists=[...distributions].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);

  function BarRow({label,value,max,color}){
    return(
      <div style={{marginBottom:10}}>
        <div style={{display:'flex',justifyContent:'space-between',fontSize:13,marginBottom:3}}>
          <span>{label}</span><span style={{fontWeight:700,color}}>{value}</span>
        </div>
        <div style={{background:'var(--gray-200)',borderRadius:4,height:8,overflow:'hidden'}}>
          <div style={{background:color,height:8,width:`${max>0?(value/max)*100:0}%`,transition:'width .4s',borderRadius:4}}/>
        </div>
      </div>
    );
  }

  return(
    <div className="page">
      <div className="section-header mb-4">
        <div><div className="section-title">🐾 Pet Pantry Dashboard</div><div className="text-sm text-muted mt-2">Duncansville Evangelical Lutheran Church</div></div>
        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-gold btn-lg" onClick={()=>navigate('receive')}>📥 Receive Donations</button>
          <button className="btn btn-primary btn-lg" onClick={()=>navigate('pickup')}>🛍 Record Pickup</button>
        </div>
      </div>

      {pendingBatches.length>0&&<div className="alert alert-warning mb-3">⚠️ You have {pendingBatches.length} pending receiving batch{pendingBatches.length>1?'es':''}.<button className="btn btn-sm btn-warning" style={{marginLeft:12}} onClick={()=>navigate('batch-review')}>Review Now</button></div>}
      {stockAlerts.filter(a=>a.level==='out').length>0&&<div className="alert alert-danger mb-3">🚫 <strong>Completely out:</strong> {stockAlerts.filter(a=>a.level==='out').map(a=>a.label).join(' · ')}</div>}
      {stockAlerts.filter(a=>a.level==='low').length>0&&<div className="alert alert-warning mb-4">⚠️ <strong>Running low:</strong> {stockAlerts.filter(a=>a.level==='low').map(a=>`${a.label} (${a.qty} left)`).join(' · ')}</div>}

      {/* Stat cards */}
      <div className="grid-4 mb-4">
        <div className="stat-card"><div className="stat-icon" style={{background:'#eaf0fb'}}>📦</div><div><div className="stat-value">{products.length}</div><div className="stat-label">Total Products</div><div className="stat-sub">{totalQty} total units</div></div></div>
        <div className="stat-card cat"><div className="stat-icon cat">🐱</div><div><div className="stat-value">{catQty}</div><div className="stat-label">Cat Supplies</div><div className="stat-sub">{cats.length} products</div></div></div>
        <div className="stat-card dog"><div className="stat-icon dog">🐶</div><div><div className="stat-value">{dogQty}</div><div className="stat-label">Dog Supplies</div><div className="stat-sub">{dogs.length} products</div></div></div>
        <div className="stat-card other"><div className="stat-icon other">👥</div><div><div className="stat-value">{helped30}</div><div className="stat-label">Families (30 days)</div><div className="stat-sub">{helpedYTD} this year</div></div></div>
      </div>

      {/* Cat · Dog · Families Helped */}
      <div className="grid-3 mb-4">
        <div className="card">
          <div className="card-header"><span className="card-title">🐱 Cat Supplies</span></div>
          {CAT_CATEGORIES.map(cat=>{const qty=cats.filter(p=>p.category===cat).reduce((s,p)=>s+(inv[p.id]||0),0);return(<div key={cat} style={{display:'flex',justifyContent:'space-between',padding:'7px 0',borderBottom:'1px solid var(--gray-100)'}}><span className="text-sm">{cat}</span><span className="text-sm font-bold" style={{color:qty===0?'var(--red)':qty<=10?'var(--orange)':'inherit'}}>{qty} units{qty===0?' ⚠️':''}</span></div>);})}
        </div>
        <div className="card">
          <div className="card-header"><span className="card-title">🐶 Dog Supplies</span></div>
          {DOG_CATEGORIES.map(cat=>{const qty=dogs.filter(p=>p.category===cat).reduce((s,p)=>s+(inv[p.id]||0),0);return(<div key={cat} style={{display:'flex',justifyContent:'space-between',padding:'7px 0',borderBottom:'1px solid var(--gray-100)'}}><span className="text-sm">{cat}</span><span className="text-sm font-bold" style={{color:qty===0?'var(--red)':qty<=10?'var(--orange)':'inherit'}}>{qty} units{qty===0?' ⚠️':''}</span></div>);})}
        </div>
        <div className="card">
          <div className="card-header"><span className="card-title">🏠 Families We Helped</span></div>
          {[['Last 7 Days',helped7],['Last 30 Days',helped30],['Last 60 Days',helped60],['Last 90 Days',helped90],['Year to Date',helpedYTD]].map(([label,count])=>(
            <div key={label} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 0',borderBottom:'1px solid var(--gray-100)'}}>
              <span className="text-sm" style={{color:'var(--gray-600)'}}>{label}</span>
              <span style={{fontWeight:800,fontSize:17,color:'var(--navy)'}}>{count}<span className="text-xs text-muted" style={{fontWeight:400,marginLeft:4}}>famil{count===1?'y':'ies'}</span></span>
            </div>
          ))}
        </div>
      </div>

      {/* Pet Types Chart · Resource Requests Chart */}
      <div className="grid-2 mb-4">
        <div className="card">
          <div className="card-header"><span className="card-title">🐾 Pets by Type</span><span className="text-xs text-muted">{totalPets} registered</span></div>
          {totalPets===0?<div className="text-sm text-muted">No pets on file yet.</div>:<>
            <BarRow label="🐱 Cats" value={petCounts.Cat||0} max={totalPets} color="#9b59b6"/>
            <BarRow label="🐶 Dogs" value={petCounts.Dog||0} max={totalPets} color="#e67e22"/>
            <BarRow label="🐾 Other" value={petCounts.Other||0} max={totalPets} color="#27ae60"/>
            <div className="text-xs text-muted mt-2">Across {clients.length} registered client{clients.length!==1?'s':''}</div>
          </>}
        </div>
        <div className="card">
          <div className="card-header"><span className="card-title">📋 Resource Requests</span><span className="text-xs text-muted">{totalRes} total</span></div>
          {totalRes===0?<div className="text-sm text-muted">No resource requests on file yet.</div>:
            RESOURCE_TYPES.filter(t=>resCounts[t]>0).sort((a,b)=>(resCounts[b]||0)-(resCounts[a]||0)).map(type=>(
              <BarRow key={type} label={`${RESOURCE_ICON[type]||'📋'} ${type}`} value={resCounts[type]||0} max={totalRes} color={RESOURCE_COLOR[type]||'var(--navy)'}/>
            ))
          }
        </div>
      </div>

      {/* Recent Activity */}
      <div className="grid-2">
        <div className="card">
          <div className="card-header"><span className="card-title">📥 Recent Donations</span><button className="btn btn-sm btn-outline" onClick={()=>navigate('batch-review')}>View All</button></div>
          {recentBatches.length===0&&<div className="text-sm text-muted">No batches yet.</div>}
          {recentBatches.map(b=>(<div key={b.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 0',borderBottom:'1px solid var(--gray-100)'}}><div><div className="text-sm font-bold">{b.donor||'Anonymous'}</div><div className="text-xs text-muted">{fmtDate(b.date)} · {b.items.length} item types</div></div><span className={`badge ${b.status==='finalized'?'badge-finalized':'badge-pending'}`}>{b.status}</span></div>))}
        </div>
        <div className="card">
          <div className="card-header"><span className="card-title">🛍 Recent Distributions</span><button className="btn btn-sm btn-outline" onClick={()=>navigate('reports')}>View All</button></div>
          {recentDists.length===0&&<div className="text-sm text-muted">No distributions yet.</div>}
          {recentDists.map(d=>{const cl=clients.find(c=>c.id===d.clientId);return(<div key={d.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 0',borderBottom:'1px solid var(--gray-100)'}}><div><div className="text-sm font-bold">{cl?`${cl.firstName} ${cl.lastName}`:'Unknown Client'}</div><div className="text-xs text-muted">{fmtDate(d.date)} · {d.items.reduce((s,i)=>s+i.qty,0)} units</div></div><button className="btn btn-sm btn-outline" onClick={()=>navigate('clients',{clientId:d.clientId})}>View</button></div>);})}
        </div>
      </div>
    </div>
  );
}

// ── PRODUCT MASTER ────────────────────────────────────────────────────────────
function ProductMaster({products,setProducts,inventory,setInventory}){
  const [search,setSearch]=useState('');const [filter,setFilter]=useState('All');const [showModal,setShowModal]=useState(false);const [editProduct,setEditProduct]=useState(null);const [upcInput,setUpcInput]=useState('');const [looking,setLooking]=useState(false);const [prefill,setPrefill]=useState(null);const [confirm,setConfirm]=useState(null);
  const filtered=products.filter(p=>{const q=search.toLowerCase();const match=!q||(p.name+p.brand+p.upc).toLowerCase().includes(q);const typeMatch=filter==='All'||p.animalType===filter;return match&&typeMatch;});
  async function handleUPCLookup(){if(!upcInput.trim())return;const existing=products.find(p=>p.upc===upcInput.trim());if(existing){setEditProduct(existing);setShowModal(true);return;}setLooking(true);const result=await lookupUPC(upcInput.trim());setLooking(false);if(result.found){setPrefill({upc:result.upc,name:result.name,brand:result.brand,size:result.size,image:result.image,animalType:'Cat',category:'Dry Food',notes:'',_source:result.source});}else{setPrefill({upc:upcInput.trim(),name:'',brand:'',size:'',image:'',animalType:'Cat',category:'Dry Food',notes:'',_source:null});}setEditProduct(null);setShowModal(true);}
  function saveProduct(form){if(editProduct){setProducts(ps=>ps.map(p=>p.id===editProduct.id?{...p,...form}:p));}else{const np={...form,id:uid()};setProducts(ps=>[...ps,np]);setInventory(inv=>[...inv,{id:uid(),productId:np.id,qty:0}]);}setShowModal(false);setPrefill(null);setUpcInput('');}
  function deleteProduct(id){setConfirm({msg:'Delete this product? This cannot be undone.',cb:()=>{setProducts(ps=>ps.filter(p=>p.id!==id));setInventory(inv=>inv.filter(i=>i.productId!==id));setConfirm(null);}});}
  const inv=useMemo(()=>{const m={};inventory.forEach(i=>m[i.productId]=i.qty);return m;},[inventory]);
  return(
    <div className="page">
      <div className="section-header mb-4"><div className="section-title">📋 Product Master</div><button className="btn btn-primary" onClick={()=>{setEditProduct(null);setPrefill(null);setShowModal(true)}}>+ Add Product</button></div>
      <div className="upc-bar mb-4"><span style={{color:'var(--gold)',fontWeight:700,fontSize:15}}>🔍 UPC Lookup</span><input className="upc-input" placeholder="Scan or type UPC barcode…" value={upcInput} onChange={e=>setUpcInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleUPCLookup()}/><button className="btn btn-gold" onClick={handleUPCLookup} disabled={looking}>{looking?'Looking…':'Search'}</button></div>
      <div className="search-bar"><input className="form-control" placeholder="Search by name, brand, or UPC…" value={search} onChange={e=>setSearch(e.target.value)}/><select className="form-control" style={{width:140}} value={filter} onChange={e=>setFilter(e.target.value)}><option>All</option>{ANIMAL_TYPES.map(t=><option key={t}>{t}</option>)}</select></div>
      <div className="table-wrap"><table><thead><tr><th>Product</th><th>UPC</th><th>Animal</th><th>Category</th><th>Size</th><th>In Stock</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>{filtered.length===0&&<tr><td colSpan={8}><div className="empty-state"><div className="icon">📦</div><h3>No products found</h3></div></td></tr>}
        {filtered.map(p=>(<tr key={p.id}><td><div style={{display:'flex',alignItems:'center',gap:10}}>{p.image?<img src={p.image} alt="" className="product-img" onError={e=>e.target.style.display='none'}/>:<div className="product-img" style={{display:'flex',alignItems:'center',justifyContent:'center',fontSize:18}}>{p.animalType==='Cat'?'🐱':p.animalType==='Dog'?'🐶':'🐾'}</div>}<div><div className="font-bold" style={{fontSize:14}}>{p.name}</div><div className="text-xs text-muted">{p.brand}</div></div></div></td><td className="text-sm text-muted">{p.upc||'—'}</td><td>{animalBadge(p.animalType)}</td><td className="text-sm">{p.category}</td><td className="text-sm">{p.size||'—'}</td><td className="font-bold">{inv[p.id]??0}</td><td>{stockBadge(inv[p.id]??0)}</td><td><div style={{display:'flex',gap:6}}><button className="btn btn-sm btn-outline" onClick={()=>{setEditProduct(p);setPrefill(null);setShowModal(true)}}>Edit</button><button className="btn btn-sm btn-danger" onClick={()=>deleteProduct(p.id)}>Del</button></div></td></tr>))}</tbody></table></div>
      <Modal show={showModal} onClose={()=>{setShowModal(false);setPrefill(null)}} title={editProduct?'Edit Product':prefill?.upc?(prefill._source?`New Product — Found via ${prefill._source}`:`New Product — UPC ${prefill.upc}`):'Add New Product'} wide>
        <ProductForm product={editProduct||prefill} onSave={saveProduct} onCancel={()=>{setShowModal(false);setPrefill(null)}}/>
      </Modal>
      <ConfirmModal show={!!confirm} message={confirm?.msg} onConfirm={confirm?.cb} onCancel={()=>setConfirm(null)}/>
    </div>
  );
}

// ── RECEIVE DONATIONS ─────────────────────────────────────────────────────────
function ReceiveDonations({products,setProducts,inventory,setInventory,batches,setBatches,navigate}){
  const [upcInput,setUpcInput]=useState('');const [looking,setLooking]=useState(false);const [batchItems,setBatchItems]=useState([]);const [donor,setDonor]=useState('');const [batchDate,setBatchDate]=useState(today());const [batchNotes,setBatchNotes]=useState('');const [showProductModal,setShowProductModal]=useState(false);const [pendingPrefill,setPendingPrefill]=useState(null);const [confirm,setConfirm]=useState(false);
  const upcRef=useRef(null);
  async function handleScan(){const code=upcInput.trim();if(!code)return;const inBatch=batchItems.findIndex(bi=>bi.upc===code);if(inBatch>=0){setBatchItems(prev=>prev.map((bi,i)=>i===inBatch?{...bi,qty:bi.qty+1}:bi));setUpcInput('');upcRef.current?.focus();return;}const prod=products.find(p=>p.upc===code);if(prod){setBatchItems(prev=>[...prev,{id:uid(),upc:code,productId:prod.id,name:prod.name,brand:prod.brand,animalType:prod.animalType,category:prod.category,size:prod.size,image:prod.image,qty:1,notes:''}]);setUpcInput('');upcRef.current?.focus();return;}setLooking(true);const result=await lookupUPC(code);setLooking(false);if(result.found){setPendingPrefill({upc:code,name:result.name,brand:result.brand,size:result.size,image:result.image,animalType:'Cat',category:'Dry Food',notes:'',_source:result.source});}else{setPendingPrefill({upc:code,name:'',brand:'',size:'',image:'',animalType:'Cat',category:'Dry Food',notes:'',_source:null});}setShowProductModal(true);setUpcInput('');}
  function saveNewProduct(form){const np={...form,id:uid()};setProducts(prev=>[...prev,np]);setInventory(prev=>[...prev,{id:uid(),productId:np.id,qty:0}]);setBatchItems(prev=>[...prev,{id:uid(),upc:np.upc,productId:np.id,name:np.name,brand:np.brand,animalType:np.animalType,category:np.category,size:np.size,image:np.image,qty:1,notes:''}]);setShowProductModal(false);setPendingPrefill(null);upcRef.current?.focus();}
  function updateItem(id,field,val){setBatchItems(prev=>prev.map(bi=>bi.id===id?{...bi,[field]:val}:bi));}
  function removeItem(id){setBatchItems(prev=>prev.filter(bi=>bi.id!==id));}
  function finalizeBatch(){if(batchItems.length===0){alert('No items in batch.');return;}const newBatch={id:uid(),date:batchDate,donor:donor||'Anonymous',status:'finalized',notes:batchNotes,items:batchItems.map(bi=>({productId:bi.productId,qty:bi.qty,notes:bi.notes}))};const updates={};batchItems.forEach(bi=>{updates[bi.productId]=(updates[bi.productId]||0)+bi.qty;});setInventory(prev=>prev.map(i=>updates[i.productId]!==undefined?{...i,qty:i.qty+updates[i.productId]}:i));setBatches(prev=>[newBatch,...prev]);setBatchItems([]);setDonor('');setBatchNotes('');setBatchDate(today());setConfirm(false);alert('Receiving batch finalized! Inventory updated. ✅');navigate('batch-review');}
  function savePending(){if(batchItems.length===0){alert('No items to save.');return;}const newBatch={id:uid(),date:batchDate,donor:donor||'Anonymous',status:'pending',notes:batchNotes,items:batchItems.map(bi=>({productId:bi.productId,qty:bi.qty,notes:bi.notes}))};setBatches(prev=>[newBatch,...prev]);setBatchItems([]);setDonor('');setBatchNotes('');setBatchDate(today());alert('Batch saved as pending.');navigate('batch-review');}
  return(
    <div className="page">
      <div className="section-header mb-4"><div className="section-title">📥 Receive Donations</div><div style={{display:'flex',gap:8}}><button className="btn btn-outline" onClick={savePending} disabled={batchItems.length===0}>Save as Pending</button><button className="btn btn-success btn-lg" onClick={()=>setConfirm(true)} disabled={batchItems.length===0}>✅ Finalize Batch</button></div></div>
      <div className="grid-2 mb-4"><div className="form-group"><label className="form-label">Donor / Source</label><input className="form-control lg" value={donor} onChange={e=>setDonor(e.target.value)} placeholder="e.g. First UMC, Anonymous, John Smith"/></div><div className="form-group"><label className="form-label">Date</label><input type="date" className="form-control lg" value={batchDate} onChange={e=>setBatchDate(e.target.value)}/></div></div>
      <div className="form-group mb-4"><label className="form-label">Batch Notes</label><input className="form-control" value={batchNotes} onChange={e=>setBatchNotes(e.target.value)} placeholder="Optional notes about this donation"/></div>
      <div className="upc-bar mb-4"><span style={{color:'var(--gold)',fontWeight:700,fontSize:15}}>📡 Scan Item</span><input ref={upcRef} className="upc-input" placeholder="Scan or type UPC barcode, then Enter…" value={upcInput} onChange={e=>setUpcInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleScan()} autoFocus/><button className="btn btn-gold" onClick={handleScan} disabled={looking}>{looking?'Looking…':'Add'}</button></div>
      {batchItems.length===0?(<div className="card"><div className="empty-state"><div className="icon">📦</div><h3>No items in batch</h3><p>Scan a UPC or add items above to begin.</p></div></div>):(<div className="card"><div className="card-header"><span className="card-title">Batch Items ({batchItems.length} products, {batchItems.reduce((s,i)=>s+i.qty,0)} units)</span></div>{batchItems.map(bi=>(<div key={bi.id} className="batch-line"><div style={{flex:1}}><div className="font-bold text-sm">{bi.name}</div><div className="text-xs text-muted">{bi.brand} · {bi.size} · {bi.upc}</div><div style={{display:'flex',gap:8,marginTop:6}}>{animalBadge(bi.animalType)}<span className="badge badge-pending">{bi.category}</span></div></div><div className="qty-controls"><button className="qty-btn" onClick={()=>updateItem(bi.id,'qty',Math.max(0,bi.qty-1))}>−</button><input className="qty-num form-control" type="number" value={bi.qty} min={0} onChange={e=>updateItem(bi.id,'qty',parseInt(e.target.value)||0)}/><button className="qty-btn" onClick={()=>updateItem(bi.id,'qty',bi.qty+1)}>+</button></div><input className="form-control text-sm" style={{width:180}} placeholder="Notes…" value={bi.notes} onChange={e=>updateItem(bi.id,'notes',e.target.value)}/><button className="btn btn-sm btn-danger" onClick={()=>removeItem(bi.id)}>✕</button></div>))}</div>)}
      <Modal show={showProductModal} onClose={()=>{setShowProductModal(false);setPendingPrefill(null);setTimeout(()=>upcRef.current?.focus(),50);}} title={pendingPrefill?._source?`Product Found — ${pendingPrefill._source}`:'New Product — Enter Details'} wide>
        <div className={`alert ${pendingPrefill?._source?'alert-success':'alert-info'} mb-3`}>{pendingPrefill?._source?`✅ Product info found via ${pendingPrefill._source}. Please confirm the details below, set the animal type and category, then save.`:'UPC not found in any database. Please fill in the product details manually and click Save.'}</div>
        <ProductForm product={pendingPrefill} onSave={saveNewProduct} onCancel={()=>{setShowProductModal(false);setPendingPrefill(null);setTimeout(()=>upcRef.current?.focus(),50);}}/>
      </Modal>
      <ConfirmModal show={confirm} message={`Finalize this batch of ${batchItems.length} products (${batchItems.reduce((s,i)=>s+i.qty,0)} units)? This will update inventory immediately.`} onConfirm={finalizeBatch} onCancel={()=>setConfirm(false)}/>
    </div>
  );
}

// ── BATCH REVIEW ──────────────────────────────────────────────────────────────
function BatchReview({batches,setBatches,products,inventory,setInventory,navigate}){
  const [detail,setDetail]=useState(null);const [confirm,setConfirm]=useState(null);
  const prodMap=useMemo(()=>{const m={};products.forEach(p=>m[p.id]=p);return m;},[products]);
  const sorted=[...batches].sort((a,b)=>b.date.localeCompare(a.date));
  function finalize(batch){const updates={};batch.items.forEach(i=>{updates[i.productId]=(updates[i.productId]||0)+i.qty;});setInventory(prev=>prev.map(i=>updates[i.productId]!==undefined?{...i,qty:i.qty+updates[i.productId]}:i));setBatches(prev=>prev.map(b=>b.id===batch.id?{...b,status:'finalized'}:b));setDetail(null);alert('Batch finalized! Inventory updated. ✅');}
  function deleteBatch(id){setConfirm({msg:'Delete this batch? This cannot be undone.',cb:()=>{setBatches(prev=>prev.filter(b=>b.id!==id));setDetail(null);setConfirm(null);}});}
  return(
    <div className="page">
      <div className="section-header mb-4"><div className="section-title">📋 Receiving Batch Review</div><button className="btn btn-gold" onClick={()=>navigate('receive')}>+ New Batch</button></div>
      <div className="table-wrap"><table><thead><tr><th>Date</th><th>Donor</th><th>Items</th><th>Units</th><th>Status</th><th>Notes</th><th>Actions</th></tr></thead>
        <tbody>{sorted.length===0&&<tr><td colSpan={7}><div className="empty-state"><div className="icon">📥</div><h3>No batches yet</h3></div></td></tr>}
        {sorted.map(b=>{const totalUnits=b.items.reduce((s,i)=>s+i.qty,0);return(<tr key={b.id}><td className="font-bold">{fmtDate(b.date)}</td><td>{b.donor||'Anonymous'}</td><td>{b.items.length}</td><td>{totalUnits}</td><td><span className={`badge ${b.status==='finalized'?'badge-finalized':'badge-pending'}`}>{b.status}</span></td><td className="text-sm text-muted">{b.notes||'—'}</td><td><div style={{display:'flex',gap:6}}><button className="btn btn-sm btn-outline" onClick={()=>setDetail(b)}>View</button>{b.status==='pending'&&<button className="btn btn-sm btn-success" onClick={()=>finalize(b)}>Finalize</button>}<button className="btn btn-sm btn-danger" onClick={()=>deleteBatch(b.id)}>Del</button></div></td></tr>);})}
        </tbody></table></div>
      {detail&&(<Modal show title={`Batch — ${detail.donor||'Anonymous'} (${fmtDate(detail.date)})`} onClose={()=>setDetail(null)} wide footer={<><button className="btn btn-outline" onClick={()=>setDetail(null)}>Close</button>{detail.status==='pending'&&<button className="btn btn-success" onClick={()=>finalize(detail)}>✅ Finalize</button>}<button className="btn btn-danger" onClick={()=>deleteBatch(detail.id)}>Delete Batch</button></>}><div className="table-wrap"><table><thead><tr><th>Product</th><th>Animal</th><th>Category</th><th>Qty</th><th>Notes</th></tr></thead><tbody>{detail.items.map((item,i)=>{const p=prodMap[item.productId];return(<tr key={i}><td>{p?p.name:<span className="text-muted">Unknown</span>}</td><td>{p&&animalBadge(p.animalType)}</td><td className="text-sm">{p?.category||'—'}</td><td className="font-bold">{item.qty}</td><td className="text-sm text-muted">{item.notes||'—'}</td></tr>);})}</tbody></table></div></Modal>)}
      <ConfirmModal show={!!confirm} message={confirm?.msg} onConfirm={confirm?.cb} onCancel={()=>setConfirm(null)}/>
    </div>
  );
}

// ── INVENTORY ─────────────────────────────────────────────────────────────────
function Inventory({products,inventory,setInventory,navigate}){
  const [search,setSearch]=useState('');const [filterType,setFilterType]=useState('All');const [editItem,setEditItem]=useState(null);const [adjQty,setAdjQty]=useState(0);const [adjReason,setAdjReason]=useState('Physical Count');const [adjNotes,setAdjNotes]=useState('');const [adjBy,setAdjBy]=useState('');const [adjustments,setAdjustments]=useState(()=>LS.get('adjustments',[]));
  const inv=useMemo(()=>{const m={};inventory.forEach(i=>m[i.productId]=i.qty);return m;},[inventory]);
  const prodMap=useMemo(()=>{const m={};products.forEach(p=>m[p.id]=p);return m;},[products]);
  const filtered=products.filter(p=>{const q=search.toLowerCase();const match=!q||(p.name+p.brand+p.upc).toLowerCase().includes(q);const typeMatch=filterType==='All'||p.animalType===filterType;return match&&typeMatch;});
  async function saveAdj(){const delta=parseInt(adjQty)||0;if(delta===0){alert('Enter a non-zero quantity adjustment.');return;}const newQty=Math.max(0,(inv[editItem.productId]||0)+delta);const newAdj={id:uid(),productId:editItem.productId,date:today(),qty:delta,reason:adjReason,notes:adjNotes,adjBy};setInventory(prev=>prev.map(i=>i.productId===editItem.productId?{...i,qty:newQty}:i));setAdjustments(prev=>[newAdj,...prev]);await sb.from('adjustments').insert({id:newAdj.id,product_id:newAdj.productId,date:newAdj.date,qty:delta,reason:adjReason,notes:adjNotes,adj_by:adjBy});setEditItem(null);setAdjQty(0);setAdjNotes('');setAdjBy('');}
  function printCountSheet(){const rows=filtered.map(p=>`<tr><td>${p.name}</td><td>${p.upc||''}</td><td>${inv[p.id]||0}</td><td></td><td></td></tr>`).join('');const w=window.open('','_blank');w.document.write(`<html><head><title>DELC Pet Pantry — Inventory Count Sheet</title><style>body{font-family:sans-serif;padding:20px}h2{color:#1a2744}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:8px;font-size:13px}th{background:#f0f2f5}</style></head><body><h2>DELC Pet Pantry — Inventory Count Sheet</h2><p>Date: ${today()}</p><table><thead><tr><th>Product Name</th><th>UPC</th><th>System Qty</th><th>Physical Count</th><th>Notes</th></tr></thead><tbody>${rows}</tbody></table></body></html>`);w.print();}
  return(
    <div className="page">
      <div className="section-header mb-4"><div className="section-title">📦 Inventory</div><div style={{display:'flex',gap:8}}><button className="btn btn-outline" onClick={printCountSheet}>🖨 Count Sheet</button><button className="btn btn-outline" onClick={()=>navigate('adjustments')}>View Adjustments</button></div></div>
      <div className="search-bar"><input className="form-control" placeholder="Search products…" value={search} onChange={e=>setSearch(e.target.value)}/><select className="form-control" style={{width:140}} value={filterType} onChange={e=>setFilterType(e.target.value)}><option>All</option>{ANIMAL_TYPES.map(t=><option key={t}>{t}</option>)}</select></div>
      <div className="table-wrap"><table><thead><tr><th>Product</th><th>UPC</th><th>Animal</th><th>Category</th><th>On Hand</th><th>Status</th><th>Adjust</th></tr></thead>
        <tbody>{filtered.length===0&&<tr><td colSpan={7}><div className="empty-state"><div className="icon">📦</div><h3>No products found</h3></div></td></tr>}
        {filtered.map(p=>{const q=inv[p.id]||0;const invRow=inventory.find(i=>i.productId===p.id);return(<tr key={p.id}><td><div className="font-bold text-sm">{p.name}</div><div className="text-xs text-muted">{p.brand}</div></td><td className="text-sm text-muted">{p.upc||'—'}</td><td>{animalBadge(p.animalType)}</td><td className="text-sm">{p.category}</td><td className="font-bold" style={{fontSize:18}}>{q}</td><td>{stockBadge(q)}</td><td><button className="btn btn-sm btn-outline" onClick={()=>{setEditItem(invRow||{productId:p.id});setAdjQty(0);setAdjNotes('');setAdjBy('');}}>± Adjust</button></td></tr>);})}
        </tbody></table></div>
      {editItem&&(()=>{const p=prodMap[editItem.productId];const currentQty=inv[editItem.productId]||0;return(<Modal show title={`Adjust: ${p?.name||'Product'}`} onClose={()=>setEditItem(null)} footer={<><button className="btn btn-outline" onClick={()=>setEditItem(null)}>Cancel</button><button className="btn btn-primary" onClick={saveAdj}>Save Adjustment</button></>}><div className="alert alert-info mb-3">Current quantity: <strong>{currentQty}</strong></div><div className="form-group"><label className="form-label">Quantity Change (+ to add, - to remove)</label><input type="number" className="form-control lg" value={adjQty} onChange={e=>setAdjQty(e.target.value)} placeholder="+5 or -3"/></div><div className="form-group"><label className="form-label">Reason *</label><select className="form-control" value={adjReason} onChange={e=>setAdjReason(e.target.value)}>{ADJ_REASONS.map(r=><option key={r}>{r}</option>)}</select></div><div className="form-group"><label className="form-label">Adjusted By</label><input className="form-control" value={adjBy} onChange={e=>setAdjBy(e.target.value)} placeholder="Volunteer name"/></div><div className="form-group"><label className="form-label">Notes</label><textarea className="form-control" value={adjNotes} onChange={e=>setAdjNotes(e.target.value)} rows={2}/></div><div className="alert alert-warning">New quantity will be: <strong>{Math.max(0,(currentQty)+(parseInt(adjQty)||0))}</strong></div></Modal>);})()} 
    </div>
  );
}

// ── STOCK COUNT ───────────────────────────────────────────────────────────────
function StockCount({products,inventory,setInventory}){
  const [counts,setCounts]=useState({});const [saving,setSaving]=useState(false);const [saved,setSaved]=useState(false);const [search,setSearch]=useState('');const [confirm,setConfirm]=useState(false);
  const inv=useMemo(()=>{const m={};inventory.forEach(i=>m[i.productId]=i.qty);return m;},[inventory]);
  useEffect(()=>{const init={};inventory.forEach(i=>{init[i.productId]=i.qty;});setCounts(init);},[inventory]);
  const SECTIONS=[{key:'Cat',label:'🐱 Cat Supplies',icon:'🐱',color:'#7d3c98',bg:'#f3ecfa',cats:['Dry Food','Wet Food','Litter','Accessories']},{key:'Dog',label:'🐶 Dog Supplies',icon:'🐶',color:'#a04000',bg:'#fef5ec',cats:['Dry Food','Wet Food','Accessories']},{key:'Other',label:'🐾 Other Animals',icon:'🐾',color:'#1a6b3a',bg:'#eafaf1',cats:['Bird','Small Animal','Reptile','Fish','Farm Animal','Other']},];
  function setCount(productId,val){const n=parseInt(val);setCounts(prev=>({...prev,[productId]:isNaN(n)||n<0?0:n}));setSaved(false);}
  const changed=useMemo(()=>Object.entries(counts).filter(([pid,qty])=>(inv[pid]||0)!==qty),[counts,inv]);
  async function saveCount(){if(changed.length===0){alert('No changes to save.');return;}setSaving(true);const updates={};changed.forEach(([pid,qty])=>{updates[pid]=qty;});setInventory(prev=>prev.map(i=>updates[i.productId]!==undefined?{...i,qty:updates[i.productId]}:i));const adjRows=changed.map(([pid,qty])=>({id:uid(),product_id:pid,date:today(),qty:qty-(inv[pid]||0),reason:'Physical Count',notes:'Stock count reconciliation',adj_by:'Stock Count',created_at:new Date().toISOString()}));await sb.from('adjustments').insert(adjRows);setSaving(false);setSaved(true);setConfirm(false);setTimeout(()=>setSaved(false),3000);}
  const q=search.toLowerCase();
  const filteredProds=products.filter(p=>!q||(p.name+p.brand+p.upc+p.category).toLowerCase().includes(q));
  return(
    <div className="page">
      <div className="section-header mb-4"><div><div className="section-title">🔢 Stock Count</div><div className="text-sm text-muted mt-2">Enter physical counts. Changes are highlighted. Save when done to update inventory.</div></div><div style={{display:'flex',gap:8,alignItems:'center'}}>{changed.length>0&&<span className="badge badge-pending">{changed.length} change{changed.length!==1?'s':''} pending</span>}{saved&&<span className="badge badge-finalized">✅ Saved!</span>}<button className="btn btn-success btn-lg" onClick={()=>setConfirm(true)} disabled={saving||changed.length===0}>{saving?'Saving…':'✅ Save Count'}</button></div></div>
      {changed.length>0&&<div className="alert alert-warning mb-4">⚠️ You have <strong>{changed.length}</strong> unsaved change{changed.length!==1?'s':''}. Click <strong>Save Count</strong> to update inventory and log adjustments.</div>}
      <div className="search-bar mb-4"><input className="form-control lg" placeholder="Filter products by name, brand, UPC, or category…" value={search} onChange={e=>setSearch(e.target.value)}/>{search&&<button className="btn btn-outline" onClick={()=>setSearch('')}>Clear</button>}</div>
      {SECTIONS.map(section=>{const sectionProds=filteredProds.filter(p=>p.animalType===section.key);if(sectionProds.length===0)return null;return(<div key={section.key} style={{marginBottom:28}}><div style={{background:section.bg,border:`2px solid ${section.color}22`,borderRadius:'var(--radius-lg)',padding:'12px 18px',marginBottom:12,display:'flex',alignItems:'center',justifyContent:'space-between'}}><div style={{display:'flex',alignItems:'center',gap:10}}><span style={{fontSize:26}}>{section.icon}</span><div><div style={{fontWeight:800,fontSize:17,color:section.color}}>{section.label}</div><div className="text-xs text-muted">{sectionProds.length} product{sectionProds.length!==1?'s':''}</div></div></div><div style={{textAlign:'right'}}><div style={{fontWeight:800,fontSize:20,color:section.color}}>{sectionProds.reduce((s,p)=>s+(counts[p.id]??inv[p.id]??0),0)}</div><div className="text-xs text-muted">counted units</div></div></div>
        {section.cats.map(cat=>{const catProds=sectionProds.filter(p=>p.category===cat);if(catProds.length===0)return null;return(<div key={cat} style={{marginBottom:16}}><div style={{fontSize:12,fontWeight:700,color:'var(--gray-400)',textTransform:'uppercase',letterSpacing:'.08em',padding:'4px 4px 8px',borderBottom:'2px solid var(--gray-200)',marginBottom:8}}>{cat}</div><div style={{display:'grid',gap:8}}>{catProds.map(p=>{const systemQty=inv[p.id]||0;const counted=counts[p.id]??systemQty;const delta=counted-systemQty;const hasChange=delta!==0;return(<div key={p.id} style={{display:'flex',alignItems:'center',gap:12,padding:'12px 14px',background:hasChange?(delta>0?'#eafaf1':'#fdecea'):'var(--white)',border:`1.5px solid ${hasChange?(delta>0?'#27ae60':'#c0392b'):'var(--gray-200)'}`,borderRadius:'var(--radius)',transition:'all .15s'}}><div style={{flex:1,minWidth:0}}><div style={{fontWeight:700,fontSize:14,color:'var(--gray-800)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{p.name}</div><div className="text-xs text-muted">{p.brand}{p.size?` · ${p.size}`:''}{p.upc?` · ${p.upc}`:''}</div></div><div style={{textAlign:'center',minWidth:70}}><div className="text-xs text-muted font-bold" style={{textTransform:'uppercase',letterSpacing:'.04em',marginBottom:2}}>System</div><div style={{fontSize:18,fontWeight:800,color:'var(--gray-400)'}}>{systemQty}</div></div><div style={{textAlign:'center',minWidth:110}}><div className="text-xs font-bold" style={{textTransform:'uppercase',letterSpacing:'.04em',marginBottom:2,color:'var(--navy)'}}>Physical Count</div><div className="qty-controls" style={{justifyContent:'center'}}><button className="qty-btn" onClick={()=>setCount(p.id,Math.max(0,counted-1))}>−</button><input className="qty-num form-control" type="number" min={0} value={counted} onChange={e=>setCount(p.id,e.target.value)} style={{width:60,textAlign:'center',fontWeight:800,fontSize:16,borderColor:hasChange?(delta>0?'var(--green)':'var(--red)'):'var(--gray-200)',color:hasChange?(delta>0?'var(--green)':'var(--red)'):'var(--gray-800)'}}/><button className="qty-btn" onClick={()=>setCount(p.id,counted+1)}>+</button></div></div><div style={{minWidth:60,textAlign:'center'}}>{hasChange?(<div><div style={{fontWeight:800,fontSize:16,color:delta>0?'var(--green)':'var(--red)'}}>{delta>0?'+':''}{delta}</div><div className="text-xs" style={{color:delta>0?'var(--green)':'var(--red)'}}>{delta>0?'gain':'loss'}</div></div>):(<span style={{color:'var(--gray-200)',fontSize:20}}>—</span>)}</div></div>);})}</div></div>);})}</div>);})}
      {filteredProds.length===0&&<div className="card"><div className="empty-state"><div className="icon">🔍</div><h3>No products match your search</h3></div></div>}
      {changed.length>0&&(<div className="card mt-4" style={{border:'2px solid var(--navy)',background:'var(--gray-50)'}}><div className="card-header"><span className="card-title">📋 Count Summary — {changed.length} Change{changed.length!==1?'s':''}</span></div><div style={{display:'grid',gap:6}}>{changed.map(([pid,newQty])=>{const p=products.find(p=>p.id===pid);const oldQty=inv[pid]||0;const delta=newQty-oldQty;return(<div key={pid} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'6px 0',borderBottom:'1px solid var(--gray-100)'}}><div><span className="font-bold text-sm">{p?.name||'Unknown'}</span><span className="text-xs text-muted" style={{marginLeft:8}}>{p?.animalType} · {p?.category}</span></div><div style={{display:'flex',alignItems:'center',gap:12}}><span className="text-sm text-muted">{oldQty} → <strong>{newQty}</strong></span><span style={{fontWeight:700,color:delta>0?'var(--green)':'var(--red)',minWidth:40,textAlign:'right'}}>{delta>0?'+':''}{delta}</span></div></div>);})}</div><div style={{display:'flex',justifyContent:'flex-end',marginTop:14}}><button className="btn btn-success btn-lg" onClick={()=>setConfirm(true)} disabled={saving}>{saving?'Saving…':'✅ Save Count & Update Inventory'}</button></div></div>)}
      <ConfirmModal show={confirm} message={`Save physical count? ${changed.length} product${changed.length!==1?'s':''} will be updated and adjustments will be logged for each change.`} onConfirm={saveCount} onCancel={()=>setConfirm(false)}/>
    </div>
  );
}

// ── STOCK COUNT HUB (Manual / Scan) ─────────────────────────────────────────────
function StockCountHub({products,setProducts,inventory,setInventory}){
  const [mode,setMode]=useState('manual');
  return(
    <div>
      <div style={{padding:'20px 24px 0',display:'flex',gap:8}}>
        <button className={`btn ${mode==='manual'?'btn-primary':'btn-outline'}`} onClick={()=>setMode('manual')}>✍️ Manual Entry</button>
        <button className={`btn ${mode==='scan'?'btn-primary':'btn-outline'}`} onClick={()=>setMode('scan')}>📷 Scan Mode</button>
      </div>
      {mode==='manual'
        ?<StockCount products={products} inventory={inventory} setInventory={setInventory}/>
        :<ScanCount products={products} setProducts={setProducts} inventory={inventory} setInventory={setInventory}/>}
    </div>
  );
}

// ── SCAN COUNT ───────────────────────────────────────────────────────────────────
function ScanCount({products,setProducts,inventory,setInventory}){
  const [session,setSession]=useState(null);
  const [scans,setScans]=useState([]);
  const [loadingSession,setLoadingSession]=useState(true);
  const [mode,setMode]=useState('each'); // 'each' | 'qty'
  const [countedBy,setCountedBy]=useState(()=>LS.get('scanCountBy',''));
  const [upcInput,setUpcInput]=useState('');
  const [looking,setLooking]=useState(false);
  const [pendingQty,setPendingQty]=useState(null); // product waiting on a typed quantity
  const [qtyInput,setQtyInput]=useState('');
  const [flash,setFlash]=useState(null);
  const [showProductModal,setShowProductModal]=useState(false);
  const [pendingPrefill,setPendingPrefill]=useState(null);
  const [confirmFinalize,setConfirmFinalize]=useState(false);
  const [confirmCancel,setConfirmCancel]=useState(false);
  const [search,setSearch]=useState('');
  const upcRef=useRef(null);
  const qtyRef=useRef(null);

  useEffect(()=>{checkOpenSession();},[]);
  useEffect(()=>{if(!flash)return;const t=setTimeout(()=>setFlash(null),1400);return()=>clearTimeout(t);},[flash]);
  useEffect(()=>{LS.set('scanCountBy',countedBy);},[countedBy]);
  useEffect(()=>{function onFocus(){if(session)refreshScans(session.id);}window.addEventListener('focus',onFocus);return()=>window.removeEventListener('focus',onFocus);},[session]);

  async function checkOpenSession(){
    setLoadingSession(true);
    const{data,error}=await sb.from('stock_count_sessions').select('*').eq('status','in_progress').order('started_at',{ascending:false}).limit(1);
    if(!error&&data&&data.length){
      const r=data[0];
      setSession({id:r.id,startedAt:r.started_at,countedBy:r.counted_by||''});
      if(r.counted_by)setCountedBy(r.counted_by);
      await refreshScans(r.id);
    }
    setLoadingSession(false);
  }

  async function refreshScans(sessionId){
    const{data}=await sb.from('stock_count_scans').select('*').eq('session_id',sessionId).order('scanned_at',{ascending:false});
    setScans((data||[]).map(r=>({id:r.id,productId:r.product_id,method:r.method,qty:r.qty,scannedBy:r.scanned_by||'',scannedAt:r.scanned_at})));
  }

  async function startSession(){
    const id=uid();const startedAt=new Date().toISOString();
    const{error}=await sb.from('stock_count_sessions').insert({id,started_at:startedAt,status:'in_progress',counted_by:countedBy||null});
    if(error){alert('Could not start count: '+error.message);return;}
    setSession({id,startedAt,countedBy});
    setScans([]);
    setTimeout(()=>upcRef.current?.focus(),50);
  }

  async function cancelSession(){
    if(!session)return;
    await sb.from('stock_count_scans').delete().eq('session_id',session.id);
    await sb.from('stock_count_sessions').update({status:'cancelled'}).eq('id',session.id);
    setSession(null);setScans([]);setConfirmCancel(false);
  }

  const inv=useMemo(()=>{const m={};inventory.forEach(i=>m[i.productId]=i.qty);return m;},[inventory]);
  const prodMap=useMemo(()=>{const m={};products.forEach(p=>m[p.id]=p);return m;},[products]);
  const tally=useMemo(()=>{const m={};scans.forEach(s=>{m[s.productId]=(m[s.productId]||0)+s.qty;});return m;},[scans]);
  const touched=useMemo(()=>Object.keys(tally).map(pid=>({productId:pid,counted:tally[pid],system:inv[pid]||0,delta:tally[pid]-(inv[pid]||0),product:prodMap[pid]})).sort((a,b)=>(a.product?.name||'').localeCompare(b.product?.name||'')),[tally,inv,prodMap]);
  const q=search.toLowerCase();
  const filteredTouched=touched.filter(t=>!q||(t.product?.name+t.product?.upc||'').toLowerCase().includes(q));
  const totalUnits=scans.reduce((s,x)=>s+x.qty,0);

  async function registerScan(productId,qty,method){
    const id=uid();const scannedAt=new Date().toISOString();
    const row={id,productId,qty,method,scannedBy:countedBy,scannedAt};
    setScans(prev=>[row,...prev]);
    const{error}=await sb.from('stock_count_scans').insert({id,session_id:session.id,product_id:productId,qty,method,scanned_by:countedBy||null,scanned_at:scannedAt});
    if(error){console.error('scan insert failed:',error);setScans(prev=>prev.filter(s=>s.id!==id));alert('Could not save scan: '+error.message);}
  }

  async function handleUpcSubmit(){
    const code=upcInput.trim();if(!code||!session)return;
    const prod=products.find(p=>p.upc===code);
    if(!prod){
      setLooking(true);const result=await lookupUPC(code);setLooking(false);
      setPendingPrefill(result.found?{upc:code,name:result.name,brand:result.brand,size:result.size,image:result.image,animalType:'Cat',category:'Dry Food',notes:'',_source:result.source}:{upc:code,name:'',brand:'',size:'',image:'',animalType:'Cat',category:'Dry Food',notes:'',_source:null});
      setShowProductModal(true);setUpcInput('');
      return;
    }
    setUpcInput('');
    if(mode==='each'){
      registerScan(prod.id,1,'each');
      setFlash({ok:true,msg:`+1 · ${prod.name}`});
      upcRef.current?.focus();
    }else{
      setPendingQty(prod);setQtyInput('1');
      setTimeout(()=>{qtyRef.current?.focus();qtyRef.current?.select();},50);
    }
  }

  function submitQty(){
    if(!pendingQty)return;
    const n=parseInt(qtyInput);
    if(isNaN(n)||n<=0){setPendingQty(null);setQtyInput('');upcRef.current?.focus();return;}
    registerScan(pendingQty.id,n,'qty');
    setFlash({ok:true,msg:`+${n} · ${pendingQty.name}`});
    setPendingQty(null);setQtyInput('');
    upcRef.current?.focus();
  }

  function saveNewProduct(form){
    const np={...form,id:uid()};
    setProducts(prev=>[...prev,np]);
    setInventory(prev=>[...prev,{id:uid(),productId:np.id,qty:0}]);
    setShowProductModal(false);setPendingPrefill(null);
    if(mode==='each'){
      registerScan(np.id,1,'each');
      setFlash({ok:true,msg:`+1 · ${np.name} (new product)`});
      setTimeout(()=>upcRef.current?.focus(),50);
    }else{
      setPendingQty(np);setQtyInput('1');
      setTimeout(()=>{qtyRef.current?.focus();qtyRef.current?.select();},50);
    }
  }

  async function undoLastScan(){
    if(scans.length===0)return;
    const last=scans[0];
    setScans(prev=>prev.slice(1));
    const{error}=await sb.from('stock_count_scans').delete().eq('id',last.id);
    if(error){console.error(error);setScans(prev=>[last,...prev]);alert('Could not undo: '+error.message);}
  }

  async function finalizeCount(){
    if(touched.length===0){alert('No items scanned yet.');return;}
    const updates={};touched.forEach(t=>{updates[t.productId]=t.counted;});
    setInventory(prev=>prev.map(i=>updates[i.productId]!==undefined?{...i,qty:updates[i.productId]}:i));
    const adjRows=touched.filter(t=>t.delta!==0).map(t=>({id:uid(),product_id:t.productId,date:today(),qty:t.delta,reason:'Physical Count',notes:'Stock count reconciliation (scan mode)',adj_by:countedBy||'Scan Count',created_at:new Date().toISOString()}));
    if(adjRows.length>0)await sb.from('adjustments').insert(adjRows);
    await sb.from('stock_count_sessions').update({status:'finalized',finalized_at:new Date().toISOString()}).eq('id',session.id);
    setSession(null);setScans([]);setConfirmFinalize(false);
    alert(`Count finalized! ${touched.length} product${touched.length!==1?'s':''} updated. ✅`);
  }

  if(loadingSession){
    return(<div className="page"><div className="card"><div className="empty-state"><div className="icon">📷</div><h3>Checking for an in-progress count…</h3></div></div></div>);
  }

  if(!session){
    return(
      <div className="page">
        <div className="section-header mb-4"><div className="section-title">📷 Scan Count</div></div>
        <div className="card" style={{maxWidth:480}}>
          <div className="card-header"><span className="card-title">Start a New Count</span></div>
          <div className="text-sm text-muted mb-3">Scan each item as you count it, or scan one and type a quantity for a full case or shelf. Every scan is saved as you go, so the count survives a closed tab and can be finished on another device.</div>
          <div className="form-group"><label className="form-label">Counted By</label><input className="form-control lg" value={countedBy} onChange={e=>setCountedBy(e.target.value)} placeholder="Volunteer name"/></div>
          <button className="btn btn-gold btn-lg" onClick={startSession}>▶️ Start Count</button>
        </div>
      </div>
    );
  }

  return(
    <div className="page">
      <div className="section-header mb-4">
        <div><div className="section-title">📷 Scan Count</div><div className="text-sm text-muted mt-2">Started {fmtDatetime(session.startedAt)}{session.countedBy?` · ${session.countedBy}`:''} · {touched.length} product{touched.length!==1?'s':''}, {totalUnits} unit{totalUnits!==1?'s':''} scanned</div></div>
        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-outline" onClick={()=>refreshScans(session.id)}>🔄 Refresh</button>
          <button className="btn btn-outline" onClick={()=>setConfirmCancel(true)}>Cancel Count</button>
          <button className="btn btn-success btn-lg" onClick={()=>setConfirmFinalize(true)} disabled={touched.length===0}>✅ Finalize Count</button>
        </div>
      </div>

      <div className="card mb-4">
        <div style={{display:'flex',gap:8,marginBottom:12}}>
          <button className={`btn ${mode==='each'?'btn-primary':'btn-outline'}`} onClick={()=>setMode('each')}>🔂 Scan Each Item</button>
          <button className={`btn ${mode==='qty'?'btn-primary':'btn-outline'}`} onClick={()=>setMode('qty')}>🔢 Scan + Enter Qty</button>
        </div>
        <div className="text-xs text-muted mb-3">{mode==='each'?'Each scan adds 1 unit. Re-scan the same barcode to keep counting more of that item.':'Scan a barcode, then type the quantity for that item and press Enter.'}</div>
        {!pendingQty
          ?<div className="upc-bar"><span style={{color:'var(--gold)',fontWeight:700,fontSize:15}}>📡 Scan</span><input ref={upcRef} className="upc-input" placeholder="Scan or type UPC barcode, then Enter…" value={upcInput} onChange={e=>setUpcInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleUpcSubmit()} autoFocus/><button className="btn btn-gold" onClick={handleUpcSubmit} disabled={looking}>{looking?'Looking…':'Add'}</button></div>
          :<div className="upc-bar" style={{background:'var(--navy)'}}><span style={{color:'var(--gold)',fontWeight:700,fontSize:15}}>🔢 Qty for {pendingQty.name}</span><input ref={qtyRef} type="number" min={1} className="upc-input" style={{maxWidth:140}} value={qtyInput} onChange={e=>setQtyInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&submitQty()}/><button className="btn btn-gold" onClick={submitQty}>Add</button><button className="btn btn-outline" onClick={()=>{setPendingQty(null);setQtyInput('');upcRef.current?.focus();}}>Cancel</button></div>}
        {flash&&<div className="alert alert-success mt-3" style={{marginBottom:0}}>✅ {flash.msg}</div>}
      </div>

      {touched.length>0&&(
        <div className="card mb-4" style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div className="text-sm">Last scanned: <strong>{prodMap[scans[0]?.productId]?.name||'—'}</strong></div>
          <button className="btn btn-sm btn-outline" onClick={undoLastScan} disabled={scans.length===0}>↩️ Undo Last Scan</button>
        </div>
      )}

      <div className="search-bar mb-4"><input className="form-control" placeholder="Filter counted products…" value={search} onChange={e=>setSearch(e.target.value)}/></div>

      {filteredTouched.length===0
        ?<div className="card"><div className="empty-state"><div className="icon">📷</div><h3>Nothing scanned yet</h3><p>Scan a barcode above to begin counting.</p></div></div>
        :<div className="table-wrap"><table><thead><tr><th>Product</th><th>UPC</th><th>System</th><th>Counted</th><th>Δ</th></tr></thead>
          <tbody>{filteredTouched.map(t=>(<tr key={t.productId}><td><div className="font-bold text-sm">{t.product?.name||'Unknown'}</div><div className="text-xs text-muted">{t.product?.brand}</div></td><td className="text-sm text-muted">{t.product?.upc||'—'}</td><td className="text-sm text-muted">{t.system}</td><td className="font-bold" style={{fontSize:16}}>{t.counted}</td><td style={{fontWeight:700,color:t.delta>0?'var(--green)':t.delta<0?'var(--red)':'var(--gray-400)'}}>{t.delta>0?'+':''}{t.delta}</td></tr>))}</tbody>
        </table></div>}

      <Modal show={showProductModal} onClose={()=>{setShowProductModal(false);setPendingPrefill(null);setTimeout(()=>upcRef.current?.focus(),50);}} title={pendingPrefill?._source?`Product Found — ${pendingPrefill._source}`:'New Product — Enter Details'} wide>
        <div className={`alert ${pendingPrefill?._source?'alert-success':'alert-info'} mb-3`}>{pendingPrefill?._source?`✅ Product info found via ${pendingPrefill._source}. Please confirm the details below, set the animal type and category, then save.`:'UPC not found in any database. Please fill in the product details manually and click Save.'}</div>
        <ProductForm product={pendingPrefill} onSave={saveNewProduct} onCancel={()=>{setShowProductModal(false);setPendingPrefill(null);setTimeout(()=>upcRef.current?.focus(),50);}}/>
      </Modal>
      <ConfirmModal show={confirmFinalize} message={`Finalize this count? ${touched.length} product${touched.length!==1?'s':''} will be updated and adjustments logged for each change.`} onConfirm={finalizeCount} onCancel={()=>setConfirmFinalize(false)}/>
      <ConfirmModal show={confirmCancel} message="Cancel this count? All scans in this session will be discarded and inventory will not be changed." onConfirm={cancelSession} onCancel={()=>setConfirmCancel(false)}/>
    </div>
  );
}

// ── ADJUSTMENTS LOG ───────────────────────────────────────────────────────────
function AdjustmentsLog({products}){
  const [adjustments]=useState(()=>LS.get('adjustments',[]));
  const prodMap=useMemo(()=>{const m={};products.forEach(p=>m[p.id]=p);return m;},[products]);
  const sorted=[...adjustments].sort((a,b)=>b.date.localeCompare(a.date));
  return(
    <div className="page">
      <div className="section-header mb-4"><div className="section-title">📊 Inventory Adjustments</div></div>
      <div className="table-wrap"><table><thead><tr><th>Date</th><th>Product</th><th>Change</th><th>Reason</th><th>Adjusted By</th><th>Notes</th></tr></thead>
        <tbody>{sorted.length===0&&<tr><td colSpan={6}><div className="empty-state"><div className="icon">📊</div><h3>No adjustments yet</h3></div></td></tr>}
        {sorted.map(a=>{const p=prodMap[a.productId];return(<tr key={a.id}><td>{fmtDate(a.date)}</td><td className="font-bold">{p?.name||'Unknown'}</td><td><span style={{color:a.qty>=0?'var(--green)':'var(--red)',fontWeight:700}}>{a.qty>=0?'+':''}{a.qty}</span></td><td><span className="badge badge-pending">{a.reason}</span></td><td>{a.adjBy||'—'}</td><td className="text-sm text-muted">{a.notes||'—'}</td></tr>);})}</tbody></table></div>
    </div>
  );
}

// ── CLIENTS ───────────────────────────────────────────────────────────────────
function Clients({clients,setClients,distributions,setDistributions,products,inventory,setInventory,navigate,params}){
  const [search,setSearch]=useState('');
  const [showModal,setShowModal]=useState(false);
  const [editClient,setEditClient]=useState(null);
  const [selectedClient,setSelectedClient]=useState(null);
  const [deleteConfirm,setDeleteConfirm]=useState(null);

  function printClientHistory(id){
    const cl=clients.find(c=>c.id===id);
    if(!cl) return;
    const cDists=distributions.filter(d=>d.clientId===id).sort((a,b)=>b.date.localeCompare(a.date));
    const rows=cDists.map(d=>{
      const items=d.items.map(i=>{const p=products.find(p=>p.id===i.productId);return `<tr><td style="padding:6px 10px;border:1px solid #ccc">${p?p.name:'Unknown'}</td><td style="padding:6px 10px;border:1px solid #ccc">${p?p.animalType:''}</td><td style="padding:6px 10px;border:1px solid #ccc">${p?p.category:''}</td><td style="padding:6px 10px;border:1px solid #ccc;text-align:center">${i.qty}</td></tr>`;}).join('');
      return `<tr><td colspan="4" style="background:#f0f2f5;padding:8px 10px;font-weight:700;border:1px solid #ccc">${fmtDate(d.date)}${d.notes?' — '+d.notes:''}</td></tr>${items}`;
    }).join('');
    const petsHtml=(cl.pets||[]).map(p=>`<li>${p.name} (${p.animalType}${p.breed?', '+p.breed:''}${p.age?', age '+p.age:''}${p.foodPref?', prefers: '+p.foodPref:''}${p.specialNotes?' — '+p.specialNotes:''})</li>`).join('');
    const resourcesHtml=(cl.resources||[]).length>0?`<h2>Resource Requests (${cl.resources.length})</h2><ul>${cl.resources.map(r=>`<li>${RESOURCE_ICON[r.type]||'📋'} ${r.type}${r.date?' on '+fmtDate(r.date):''}${r.phone?' · called from '+r.phone:''}${r.notes?' — '+r.notes:''}${r.offered?' | Given: '+r.offered:''}</li>`).join('')}</ul>`:'';
    const w=window.open('','_blank');
    w.document.write(`<html><head><title>Client History — ${cl.firstName} ${cl.lastName}</title><style>body{font-family:sans-serif;padding:30px;max-width:800px;margin:0 auto}h1{color:#1a2744}h2{color:#1a2744;font-size:15px;margin-top:20px}table{width:100%;border-collapse:collapse;margin-bottom:16px}th{background:#f0f2f5;padding:8px 10px;border:1px solid #ccc;text-align:left}p{margin:4px 0;font-size:14px}ul{margin:4px 0;font-size:14px}</style></head><body><h1>DELC Pet Pantry — Client Record</h1><p><strong>${cl.firstName} ${cl.lastName}</strong></p>${cl.phone?`<p>📞 ${cl.phone}</p>`:''}${cl.email?`<p>✉️ ${cl.email}</p>`:''}${cl.address?`<p>📍 ${cl.address}</p>`:''}${cl.notes?`<p><em>Notes: ${cl.notes}</em></p>`:''}<h2>Animals (${(cl.pets||[]).length})</h2>${petsHtml?`<ul>${petsHtml}</ul>`:'<p>None on file.</p>'}${resourcesHtml}<h2>Pickup History (${cDists.length} visit${cDists.length!==1?'s':''})</h2>${cDists.length?`<table><thead><tr><th>Product</th><th>Animal</th><th>Category</th><th>Qty</th></tr></thead><tbody>${rows}</tbody></table>`:'<p>No pickups on file.</p>'}<p style="margin-top:30px;font-size:12px;color:#aaa">Printed ${new Date().toLocaleDateString()} — DELC Pet Pantry</p></body></html>`);
    w.print();
  }

  async function deleteClient(id){
    const clientDists=distributions.filter(d=>d.clientId===id).map(d=>d.id);
    if(clientDists.length){
      await sb.from('distribution_items').delete().in('distribution_id',clientDists);
      await sb.from('distributions').delete().eq('client_id',id);
    }
    await sb.from('client_resources').delete().eq('client_id',id);
    await sb.from('pets').delete().eq('client_id',id);
    await sb.from('clients').delete().eq('id',id);
    setClients(prev=>prev.filter(c=>c.id!==id));
    setDistributions(prev=>prev.filter(d=>d.clientId!==id));
    setDeleteConfirm(null);
    if(selectedClient?.id===id) setSelectedClient(null);
  }

  const [editDist,setEditDist]=useState(null);const [editDistItems,setEditDistItems]=useState([]);const [editDistDate,setEditDistDate]=useState('');const [editDistNotes,setEditDistNotes]=useState('');const [editUpcInput,setEditUpcInput]=useState('');const [editConfirm,setEditConfirm]=useState(false);const [deleteDistConfirm,setDeleteDistConfirm]=useState(null);

  async function deleteDistribution(id){
    const dist=distributions.find(d=>d.id===id);
    if(dist){const updates={};dist.items.forEach(i=>{updates[i.productId]=(updates[i.productId]||0)+i.qty;});setInventory(prev=>prev.map(i=>updates[i.productId]?{...i,qty:i.qty+updates[i.productId]}:i));}
    await sb.from('distribution_items').delete().eq('distribution_id',id);
    await sb.from('distributions').delete().eq('id',id);
    setDistributions(prev=>prev.filter(d=>d.id!==id));
    setDeleteDistConfirm(null);
  }

  const inv=useMemo(()=>{const m={};inventory.forEach(i=>m[i.productId]=i.qty);return m;},[inventory]);

  function openEditDist(d){setEditDist(d);setEditDistItems(d.items.map(i=>({...i,id:i.id||uid()})));setEditDistDate(d.date);setEditDistNotes(d.notes||'');setEditUpcInput('');}
  function closeEditDist(){setEditDist(null);setEditDistItems([]);setEditConfirm(false);}
  function editDistAddByUPC(){const code=editUpcInput.trim();if(!code)return;const prod=products.find(p=>p.upc===code);if(!prod){alert('Product not found in master.');return;}const existing=editDistItems.findIndex(i=>i.productId===prod.id);if(existing>=0){setEditDistItems(prev=>prev.map((it,i)=>i===existing?{...it,qty:it.qty+1}:it));}else{setEditDistItems(prev=>[...prev,{id:uid(),productId:prod.id,qty:1,notes:''}]);}setEditUpcInput('');}
  function editDistAddProduct(p){const existing=editDistItems.findIndex(i=>i.productId===p.id);if(existing>=0){setEditDistItems(prev=>prev.map((it,i)=>i===existing?{...it,qty:it.qty+1}:it));}else{setEditDistItems(prev=>[...prev,{id:uid(),productId:p.id,qty:1,notes:''}]);}}
  function saveEditDist(){
    const originalMap={};editDist.items.forEach(i=>{originalMap[i.productId]=(originalMap[i.productId]||0)+i.qty;});
    const newMap={};editDistItems.forEach(i=>{newMap[i.productId]=(newMap[i.productId]||0)+i.qty;});
    for(const item of editDistItems){const origQty=originalMap[item.productId]||0;const delta=item.qty-origQty;if(delta>0&&(inv[item.productId]||0)<delta){const p=products.find(p=>p.id===item.productId);alert(`Not enough stock for ${p?.name}. Only ${inv[item.productId]||0} additional units available.`);return;}}
    setInventory(prev=>prev.map(i=>{const wasGiven=originalMap[i.productId]||0;const nowGiven=newMap[i.productId]||0;const delta=wasGiven-nowGiven;return delta!==0?{...i,qty:i.qty+delta}:i;}));
    setDistributions(prev=>prev.map(d=>d.id===editDist.id?{...d,date:editDistDate,notes:editDistNotes,items:editDistItems.map(i=>({productId:i.productId,qty:i.qty,notes:i.notes||''}))}:d));
    closeEditDist();
  }

  useEffect(()=>{if(params?.clientId){const cl=clients.find(c=>c.id===params.clientId);if(cl)setSelectedClient(cl);}},[params]);

  const filtered=clients.filter(c=>{const q=search.toLowerCase();return !q||(c.firstName+' '+c.lastName+c.phone+c.email).toLowerCase().includes(q);});

  // ── CLIENT FORM (with Pets + Resources) ──────────────────────────────────
  function ClientForm({client,onSave,onCancel}){
    const [form,setForm]=useState(client||{firstName:'',lastName:'',phone:'',email:'',address:'',notes:'',pets:[],resources:[]});
    const set=k=>e=>setForm(f=>({...f,[k]:e.target.value}));

    // Pet modal state
    const [petModal,setPetModal]=useState(false);
    const [editPet,setEditPet]=useState(null);
    const [petForm,setPetForm]=useState({name:'',animalType:'Cat',breed:'',age:'',specialNotes:'',foodPref:''});

    function savePet(){
      if(!petForm.name.trim()){alert('Pet name required');return;}
      if(editPet){setForm(f=>({...f,pets:f.pets.map(p=>p.id===editPet.id?{...p,...petForm}:p)}));}
      else{setForm(f=>({...f,pets:[...f.pets,{...petForm,id:uid()}]}));}
      setPetModal(false);setEditPet(null);setPetForm({name:'',animalType:'Cat',breed:'',age:'',specialNotes:'',foodPref:''});
    }

    // Resource modal state
    const [resModal,setResModal]=useState(false);
    const [editRes,setEditRes]=useState(null);
    const [resForm,setResForm]=useState({type:'Food',date:today(),phone:'',notes:'',offered:'',status:null});

    function saveResource(){
      if(editRes){setForm(f=>({...f,resources:f.resources.map(r=>r.id===editRes.id?{...r,...resForm}:r)}));}
      else{setForm(f=>({...f,resources:[...f.resources,{...resForm,id:uid()}]}));}
      setResModal(false);setEditRes(null);setResForm({type:'Food',date:today(),phone:'',notes:'',offered:'',status:null});
    }

    return(
      <div>
        <div className="grid-2">
          <div className="form-group"><label className="form-label">First Name *</label><input className="form-control" value={form.firstName} onChange={set('firstName')} required/></div>
          <div className="form-group"><label className="form-label">Last Name *</label><input className="form-control" value={form.lastName} onChange={set('lastName')} required/></div>
          <div className="form-group"><label className="form-label">Phone</label><input className="form-control" value={form.phone} onChange={set('phone')} type="tel"/></div>
          <div className="form-group"><label className="form-label">Email</label><input className="form-control" value={form.email} onChange={set('email')} type="email"/></div>
        </div>
        <div className="form-group"><label className="form-label">Address</label><input className="form-control" value={form.address} onChange={set('address')}/></div>
        <div className="form-group"><label className="form-label">Notes</label><textarea className="form-control" value={form.notes} onChange={set('notes')} rows={2}/></div>

        {/* ── PETS ── */}
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
          <strong>Animals ({form.pets.length})</strong>
          <button type="button" className="btn btn-sm btn-outline" onClick={()=>{setPetModal(true);setEditPet(null);setPetForm({name:'',animalType:'Cat',breed:'',age:'',specialNotes:'',foodPref:''});}}>+ Add Animal</button>
        </div>
        {form.pets.map(pet=>(
          <div key={pet.id} style={{display:'flex',alignItems:'center',gap:10,padding:'8px',border:'1.5px solid var(--gray-200)',borderRadius:'var(--radius)',marginBottom:6}}>
            <span style={{fontSize:22}}>{pet.animalType==='Cat'?'🐱':pet.animalType==='Dog'?'🐶':'🐾'}</span>
            <div style={{flex:1}}><div className="font-bold text-sm">{pet.name}</div><div className="text-xs text-muted">{pet.animalType} · {pet.breed||'Unknown breed'} · Age: {pet.age||'?'}</div></div>
            <button className="btn btn-sm btn-outline" onClick={()=>{setEditPet(pet);setPetForm(pet);setPetModal(true);}}>Edit</button>
            <button className="btn btn-sm btn-danger" onClick={()=>setForm(f=>({...f,pets:f.pets.filter(p=>p.id!==pet.id)}))}>✕</button>
          </div>
        ))}

        {/* ── RESOURCES ── */}
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8,marginTop:16,paddingTop:14,borderTop:'1.5px solid var(--gray-200)'}}>
          <strong>Resource Requests ({(form.resources||[]).length})</strong>
          <button type="button" className="btn btn-sm btn-gold" onClick={()=>{setResModal(true);setEditRes(null);setResForm({type:'Food',date:today(),phone:'',notes:'',offered:''});}}>+ Add Resource</button>
        </div>
        {(form.resources||[]).length===0&&<p className="text-xs text-muted mb-3">No resource requests on file.</p>}
        {(form.resources||[]).map(res=>(
          <div key={res.id} style={{display:'flex',alignItems:'flex-start',gap:10,padding:'10px',border:`1.5px solid ${RESOURCE_COLOR[res.type]||'var(--gray-200)'}44`,borderRadius:'var(--radius)',marginBottom:6,background:res.type?`${RESOURCE_COLOR[res.type]}08`:'var(--gray-50)'}}>
            <span style={{fontSize:22,marginTop:2}}>{RESOURCE_ICON[res.type]||'📋'}</span>
            <div style={{flex:1}}>
              <div style={{fontWeight:700,fontSize:14,color:RESOURCE_COLOR[res.type]||'var(--gray-800)'}}>{res.type}</div>
              <div className="text-xs text-muted">{res.date?fmtDate(res.date):''}{res.phone?` · 📞 ${res.phone}`:''}</div>
              {res.status==='given'&&<div className="text-xs" style={{color:'var(--green)',fontWeight:700,marginTop:2}}>✅ We helped</div>}
              {res.status==='unable'&&<div className="text-xs" style={{color:'var(--red)',fontWeight:700,marginTop:2}}>❌ Unable to fully help</div>}
