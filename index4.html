// ── LEDGER ───────────────────────────────────────────────────────────────────
function Ledger({ledger,setLedger,currentUser}){
  const [showModal,setShowModal]=useState(false);
  const [editEntry,setEditEntry]=useState(null);
  const [confirm,setConfirm]=useState(null);
  const [dateFrom,setDateFrom]=useState('');
  const [dateTo,setDateTo]=useState('');
  const [typeFilter,setTypeFilter]=useState('All');
  const [catFilter,setCatFilter]=useState('All');
  const emptyForm={date:today(),type:'deposit',category:'Donation',description:'',amount:'',vendor:'',donatedBy:'',paymentMethod:'Cash',receiptNumber:'',notes:''};
  const [form,setForm]=useState(emptyForm);
  const set=k=>e=>setForm(f=>({...f,[k]:e.target.value}));

  // Switch categories when type changes
  function setType(t){setForm(f=>({...f,type:t,category:t==='deposit'?'Donation':'Pet Food'}));}

  const sorted=useMemo(()=>[...ledger].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id)),[ledger]);

  const filtered=useMemo(()=>sorted.filter(e=>{
    if(typeFilter!=='All'&&e.type!==typeFilter)return false;
    if(catFilter!=='All'&&e.category!==catFilter)return false;
    if(dateFrom&&e.date<dateFrom)return false;
    if(dateTo&&e.date>dateTo)return false;
    return true;
  }),[sorted,typeFilter,catFilter,dateFrom,dateTo]);

  // Running balance (on full sorted list, newest first — show balance at that point)
  const balanceMap=useMemo(()=>{
    const asc=[...sorted].reverse();
    let running=0;const m={};
    asc.forEach(e=>{running+=e.type==='deposit'?e.amount:-e.amount;m[e.id]=running;});
    return m;
  },[sorted]);

  const totalDeposits=ledger.filter(e=>e.type==='deposit').reduce((s,e)=>s+e.amount,0);
  const totalExpenses=ledger.filter(e=>e.type==='expense').reduce((s,e)=>s+e.amount,0);
  const netBalance=totalDeposits-totalExpenses;
  const fmtMoney=n=>`${Math.abs(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',')}`;

  function openAdd(){setForm(emptyForm);setEditEntry(null);setShowModal(true);}
  function openEdit(e){setForm({date:e.date,type:e.type,category:e.category,description:e.description,amount:String(e.amount),vendor:e.vendor,donatedBy:e.donatedBy,paymentMethod:e.paymentMethod,receiptNumber:e.receiptNumber,notes:e.notes});setEditEntry(e);setShowModal(true);}

  async function saveEntry(){
    const amt=parseFloat(form.amount);
    if(!form.date){alert('Date required');return;}
    if(isNaN(amt)||amt<=0){alert('Enter a valid amount greater than 0');return;}
    if(!form.description.trim()){alert('Description required');return;}
    const entry={id:editEntry?editEntry.id:uid(),date:form.date,type:form.type,category:form.category,description:form.description.trim(),amount:amt,vendor:form.vendor.trim(),donatedBy:form.donatedBy.trim(),paymentMethod:form.paymentMethod,receiptNumber:form.receiptNumber.trim(),notes:form.notes.trim(),createdBy:currentUser};
    const row={id:entry.id,date:entry.date,type:entry.type,category:entry.category,description:entry.description,amount:entry.amount,vendor:entry.vendor||null,donated_by:entry.donatedBy||null,payment_method:entry.paymentMethod||null,receipt_number:entry.receiptNumber||null,notes:entry.notes||null,created_by:entry.createdBy||null};
    if(editEntry){
      const{error}=await sb.from('ledger').update(row).eq('id',entry.id);
      if(error){console.error('ledger update:',error);alert('Save failed: '+error.message);return;}
      setLedger(prev=>prev.map(e=>e.id===entry.id?entry:e));
    }else{
      const{error}=await sb.from('ledger').insert(row);
      if(error){console.error('ledger insert:',error);alert('Save failed: '+error.message);return;}
      setLedger(prev=>[...prev,entry]);
    }
    setShowModal(false);setEditEntry(null);setForm(emptyForm);
  }

  function deleteEntry(id){setConfirm({msg:'Delete this ledger entry? This cannot be undone.',cb:async()=>{
    await sb.from('ledger').delete().eq('id',id);
    setLedger(prev=>prev.filter(e=>e.id!==id));setConfirm(null);
  }});}

  function doExport(){
    const cols=[{key:'date',label:'Date'},{key:'type',label:'Type'},{key:'category',label:'Category'},{key:'description',label:'Description'},{key:'amount',label:'Amount'},{key:'vendor',label:'Vendor'},{key:'donatedBy',label:'Donated By'},{key:'paymentMethod',label:'Payment Method'},{key:'receiptNumber',label:'Receipt #'},{key:'notes',label:'Notes'},{key:'createdBy',label:'Entered By'}];
    exportCSV(filtered,cols,'DELC_Ledger_'+today());
  }

  const allCats=[...new Set(ledger.map(e=>e.category))].filter(Boolean);

  const cats=form.type==='deposit'?LEDGER_DEPOSIT_CATS:LEDGER_EXPENSE_CATS;

  return(
    <div className="page">
      <div className="section-header mb-4">
        <div><div className="section-title">💰 Financial Ledger</div><div className="text-sm text-muted mt-2">Donations received · Expenses paid</div></div>
        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-outline" onClick={doExport}>📥 Export CSV</button>
          <button className="btn btn-gold btn-lg" onClick={openAdd}>+ Add Entry</button>
        </div>
      </div>

      {/* Summary cards */}
      <div className="grid-3 mb-4">
        <div className="card" style={{borderTop:'4px solid var(--green)',textAlign:'center'}}>
          <div style={{fontSize:11,fontWeight:700,color:'var(--gray-400)',textTransform:'uppercase',letterSpacing:'.08em',marginBottom:4}}>Total Deposits</div>
          <div style={{fontSize:28,fontWeight:900,color:'var(--green)'}}>{fmtMoney(totalDeposits)}</div>
          <div className="text-xs text-muted mt-1">{ledger.filter(e=>e.type==='deposit').length} entries</div>
        </div>
        <div className="card" style={{borderTop:'4px solid var(--red)',textAlign:'center'}}>
          <div style={{fontSize:11,fontWeight:700,color:'var(--gray-400)',textTransform:'uppercase',letterSpacing:'.08em',marginBottom:4}}>Total Expenses</div>
          <div style={{fontSize:28,fontWeight:900,color:'var(--red)'}}>{fmtMoney(totalExpenses)}</div>
          <div className="text-xs text-muted mt-1">{ledger.filter(e=>e.type==='expense').length} entries</div>
        </div>
        <div className="card" style={{borderTop:`4px solid ${netBalance>=0?'var(--navy)':'var(--red)'}`,textAlign:'center'}}>
          <div style={{fontSize:11,fontWeight:700,color:'var(--gray-400)',textTransform:'uppercase',letterSpacing:'.08em',marginBottom:4}}>Net Balance</div>
          <div style={{fontSize:28,fontWeight:900,color:netBalance>=0?'var(--navy)':'var(--red)'}}>{netBalance<0?'-':''}{fmtMoney(netBalance)}</div>
          <div className="text-xs text-muted mt-1">{netBalance>=0?'In the black':'In the red'}</div>
        </div>
      </div>

      {/* Filters */}
      <div className="report-filter-bar mb-2">
        <div className="form-group" style={{margin:0}}><label className="form-label">From</label><input type="date" className="form-control" value={dateFrom} onChange={e=>setDateFrom(e.target.value)}/></div>
        <div className="form-group" style={{margin:0}}><label className="form-label">To</label><input type="date" className="form-control" value={dateTo} onChange={e=>setDateTo(e.target.value)}/></div>
        <div className="form-group" style={{margin:0}}><label className="form-label">Type</label>
          <select className="form-control" value={typeFilter} onChange={e=>setTypeFilter(e.target.value)}>
            <option value="All">All Types</option><option value="deposit">Deposits</option><option value="expense">Expenses</option>
          </select>
        </div>
        <div className="form-group" style={{margin:0}}><label className="form-label">Category</label>
          <select className="form-control" value={catFilter} onChange={e=>setCatFilter(e.target.value)}>
            <option value="All">All Categories</option>{allCats.map(c=><option key={c}>{c}</option>)}
          </select>
        </div>
        <button className="btn btn-outline" onClick={()=>{setDateFrom('');setDateTo('');setTypeFilter('All');setCatFilter('All');}}>Clear</button>
      </div>
      <div className="text-xs text-muted mb-3">{filtered.length} entries · Filtered deposits: {fmtMoney(filtered.filter(e=>e.type==='deposit').reduce((s,e)=>s+e.amount,0))} · Filtered expenses: {fmtMoney(filtered.filter(e=>e.type==='expense').reduce((s,e)=>s+e.amount,0))}</div>

      {/* Ledger table */}
      <div className="table-wrap">
        <table>
          <thead><tr><th>Date</th><th>Type</th><th>Category</th><th>Description</th><th>Vendor / Donor</th><th>Method</th><th>Receipt #</th><th style={{textAlign:'right'}}>Amount</th><th style={{textAlign:'right'}}>Balance</th><th>Actions</th></tr></thead>
          <tbody>
            {filtered.length===0&&<tr><td colSpan={10}><div className="empty-state"><div className="icon">💰</div><h3>No ledger entries</h3><p>Click "+ Add Entry" to get started.</p></div></td></tr>}
            {filtered.map(e=>(
              <tr key={e.id}>
                <td className="font-bold text-sm">{fmtDate(e.date)}</td>
                <td>{e.type==='deposit'?<span className="badge badge-finalized">💚 Deposit</span>:<span className="badge badge-out">🔴 Expense</span>}</td>
                <td className="text-sm">{e.category}</td>
                <td><div className="font-bold text-sm">{e.description}</div>{e.notes&&<div className="text-xs text-muted">{e.notes}</div>}</td>
                <td className="text-sm">{e.type==='deposit'?(e.donatedBy||'—'):(e.vendor||'—')}</td>
                <td className="text-sm text-muted">{e.paymentMethod||'—'}</td>
                <td className="text-sm text-muted">{e.receiptNumber||'—'}</td>
                <td style={{textAlign:'right',fontWeight:700,fontSize:15,color:e.type==='deposit'?'var(--green)':'var(--red)'}}>{e.type==='deposit'?'+':'-'}{fmtMoney(e.amount)}</td>
                <td style={{textAlign:'right',fontSize:13,fontWeight:600,color:balanceMap[e.id]>=0?'var(--navy)':'var(--red)'}}>{balanceMap[e.id]<0?'-':''}{fmtMoney(balanceMap[e.id])}</td>
                <td><div style={{display:'flex',gap:6}}>
                  <button className="btn btn-sm btn-outline" onClick={()=>openEdit(e)}>Edit</button>
                  <button className="btn btn-sm btn-danger" onClick={()=>deleteEntry(e.id)}>Del</button>
                </div></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {/* Add/Edit Modal */}
      <Modal show={showModal} onClose={()=>{setShowModal(false);setEditEntry(null);}} title={editEntry?'Edit Ledger Entry':'Add Ledger Entry'} wide
        footer={<><button className="btn btn-outline" onClick={()=>{setShowModal(false);setEditEntry(null);}}>Cancel</button><button className={`btn ${form.type==='deposit'?'btn-success':'btn-danger'}`} onClick={saveEntry}>{editEntry?'Save Changes':form.type==='deposit'?'💚 Add Deposit':'🔴 Add Expense'}</button></>}>

        {/* Deposit / Expense toggle */}
        <div style={{display:'flex',gap:0,marginBottom:20,borderRadius:'var(--radius)',overflow:'hidden',border:'1.5px solid var(--gray-200)'}}>
          <button type="button" onClick={()=>setType('deposit')} style={{flex:1,padding:'12px',border:'none',cursor:'pointer',fontWeight:700,fontSize:15,background:form.type==='deposit'?'var(--green)':'var(--white)',color:form.type==='deposit'?'var(--white)':'var(--gray-600)',transition:'all .15s'}}>💚 Deposit / Donation</button>
          <button type="button" onClick={()=>setType('expense')} style={{flex:1,padding:'12px',border:'none',cursor:'pointer',fontWeight:700,fontSize:15,background:form.type==='expense'?'var(--red)':'var(--white)',color:form.type==='expense'?'var(--white)':'var(--gray-600)',borderLeft:'1.5px solid var(--gray-200)',transition:'all .15s'}}>🔴 Expense / Purchase</button>
        </div>

        <div className="grid-2">
          <div className="form-group"><label className="form-label">Date *</label><input type="date" className="form-control" value={form.date} onChange={set('date')}/></div>
          <div className="form-group"><label className="form-label">Amount * ($)</label><input type="number" className="form-control" value={form.amount} onChange={set('amount')} placeholder="0.00" min="0" step="0.01"/></div>
          <div className="form-group"><label className="form-label">Category</label>
            <select className="form-control" value={form.category} onChange={set('category')}>{cats.map(c=><option key={c}>{c}</option>)}</select>
          </div>
          <div className="form-group"><label className="form-label">Payment Method</label>
            <select className="form-control" value={form.paymentMethod} onChange={set('paymentMethod')}>{PAYMENT_METHODS.map(m=><option key={m}>{m}</option>)}</select>
          </div>
        </div>
        <div className="form-group"><label className="form-label">Description *</label><input className="form-control" value={form.description} onChange={set('description')} placeholder={form.type==='deposit'?'e.g. Annual church pet food offering':'e.g. Pedigree Adult Dry Dog Food 40lb'}/></div>
        <div className="grid-2">
          {form.type==='expense'
            ?<div className="form-group"><label className="form-label">Vendor / Store</label><input className="form-control" value={form.vendor} onChange={set('vendor')} placeholder="e.g. Walmart, PetSmart"/></div>
            :<div className="form-group"><label className="form-label">Donated By</label><input className="form-control" value={form.donatedBy} onChange={set('donatedBy')} placeholder="e.g. First UMC, Jane Smith"/></div>
          }
          <div className="form-group"><label className="form-label">Receipt / Check #</label><input className="form-control" value={form.receiptNumber} onChange={set('receiptNumber')} placeholder="Optional"/></div>
        </div>
        <div className="form-group"><label className="form-label">Notes</label><textarea className="form-control" rows={2} value={form.notes} onChange={set('notes')} placeholder="Any additional details…"/></div>
      </Modal>

      <ConfirmModal show={!!confirm} message={confirm?.msg} onConfirm={confirm?.cb} onCancel={()=>setConfirm(null)}/>
    </div>
  );
}

// ── APP ───────────────────────────────────────────────────────────────────────
function App(){
  const [currentUser,setCurrentUser]=useState(()=>LS.get('currentUser',null));
  const [page,setPage]=useState('dashboard');
  const [pageParams,setPageParams]=useState(null);
  const [products,setProductsState]=useState([]);
  const [inventory,setInventoryState]=useState([]);
  const [batches,setBatchesState]=useState([]);
  const [distributions,setDistributionsState]=useState([]);
  const [clients,setClientsState]=useState([]);
  const [requests,setRequestsState]=useState([]);
  const [ledger,setLedgerState]=useState([]);
  const [loading,setLoading]=useState(true);
  const [dbError,setDbError]=useState(null);

  // ── LOAD ALL DATA FROM SUPABASE ──────────────────────────────────────────
  async function loadAll(){
    setLoading(true);setDbError(null);
    try{
      const [pRes,iRes,bRes,biRes,cRes,petRes,resRes,dRes,diRes,aRes,lRes,rRes,riRes]=await Promise.all([
        sb.from('products').select('*'),
        sb.from('inventory').select('*'),
        sb.from('batches').select('*').order('date',{ascending:false}),
        sb.from('batch_items').select('*'),
        sb.from('clients').select('*').order('last_name'),
        sb.from('pets').select('*'),
        sb.from('client_resources').select('*'),
        sb.from('distributions').select('*').order('date',{ascending:false}),
        sb.from('distribution_items').select('*'),
        sb.from('adjustments').select('*').order('created_at',{ascending:false}),
        sb.from('ledger').select('*').order('date',{ascending:false}),
        sb.from('requests').select('*').order('date',{ascending:false}),
        sb.from('request_items').select('*'),
      ]);
      if(pRes.error) throw pRes.error;
      setProductsState((pRes.data||[]).map(rowToProduct));
      setInventoryState((iRes.data||[]).map(rowToInventory));
      const bItems=biRes.data||[];
      setBatchesState((bRes.data||[]).map(b=>rowToBatch(b,bItems.filter(i=>i.batch_id===b.id).map(rowToBatchItem))));
      // Assemble clients with pets AND resources
      const petsData=(petRes.data||[]).map(rowToPet);
      const resourcesData=(resRes.data||[]).map(rowToResource);
      setClientsState((cRes.data||[]).map(c=>rowToClient(c,petsData.filter(p=>p.clientId===c.id),resourcesData.filter(r=>r.clientId===c.id))));
      const diItems=diRes.data||[];
      setDistributionsState((dRes.data||[]).map(d=>rowToDistribution(d,diItems.filter(i=>i.distribution_id===d.id).map(rowToDistItem))));
      LS.set('adjustments',(aRes.data||[]).map(rowToAdj));
      setLedgerState((lRes.data||[]).map(rowToLedger));
      const riItems=riRes.data||[];
      setRequestsState((rRes.data||[]).map(r=>rowToRequest(r,riItems.filter(i=>i.request_id===r.id).map(rowToRequestItem))));
    }catch(e){
      console.error(e);
      setDbError('Could not connect to database: '+e.message);
    }
    setLoading(false);
  }

  useEffect(()=>{if(currentUser) loadAll();},[currentUser]);
  useEffect(()=>LS.set('currentUser',currentUser),[currentUser]);

  // ── SUPABASE WRITE HELPERS ───────────────────────────────────────────────
  async function setProducts(updater){const next=typeof updater==='function'?updater(products):updater;setProductsState(next);await sb.from('products').upsert(next.map(productToRow));}
  async function setInventory(updater){const next=typeof updater==='function'?updater(inventory):updater;setInventoryState(next);const rows=next.map(i=>({id:i.id,product_id:i.productId,qty:i.qty,updated_at:new Date().toISOString()}));await sb.from('inventory').upsert(rows);}
  async function setBatches(updater){
    const next=typeof updater==='function'?updater(batches):updater;setBatchesState(next);
    for(const b of next){await sb.from('batches').upsert({id:b.id,date:b.date,donor:b.donor,status:b.status,notes:b.notes});await sb.from('batch_items').delete().eq('batch_id',b.id);if(b.items.length>0)await sb.from('batch_items').insert(b.items.map((item,idx)=>({id:b.id+'_'+idx,batch_id:b.id,product_id:item.productId,qty:item.qty,notes:item.notes||''})));}
    const ids=next.map(b=>b.id);const removed=batches.map(b=>b.id).filter(id=>!ids.includes(id));for(const id of removed) await sb.from('batches').delete().eq('id',id);
  }
  async function setDistributions(updater){
    const next=typeof updater==='function'?updater(distributions):updater;setDistributionsState(next);
    for(const d of next){await sb.from('distributions').upsert({id:d.id,client_id:d.clientId,date:d.date,notes:d.notes});await sb.from('distribution_items').delete().eq('distribution_id',d.id);if(d.items.length>0)await sb.from('distribution_items').insert(d.items.map((item,idx)=>({id:d.id+'_'+idx,distribution_id:d.id,product_id:item.productId,qty:item.qty,notes:item.notes||''})));}
    const ids=next.map(d=>d.id);const removed=distributions.map(d=>d.id).filter(id=>!ids.includes(id));for(const id of removed) await sb.from('distributions').delete().eq('id',id);
  }
  async function setRequests(updater){
    const next=typeof updater==='function'?updater(requests):updater;setRequestsState(next);
    for(const r of next){
      await sb.from('requests').upsert({id:r.id,client_id:r.clientId,date:r.date,status:r.status,method:r.method||null,notes:r.notes||'',created_by:r.createdBy||'',created_at:r.createdAt||new Date().toISOString(),fulfilled_at:r.fulfilledAt||null,distribution_id:r.distributionId||null});
      await sb.from('request_items').delete().eq('request_id',r.id);
      if(r.items.length>0)await sb.from('request_items').insert(r.items.map((item,idx)=>({id:r.id+'_'+idx,request_id:r.id,pet_name:item.petName||'',animal_type:item.animalType||'',category:item.category||'',description:item.description||'',qty_requested:item.qtyRequested})));
    }
    const ids=next.map(r=>r.id);const removed=requests.map(r=>r.id).filter(id=>!ids.includes(id));for(const id of removed) await sb.from('requests').delete().eq('id',id);
  }

  // setClients: syncs pets AND resources to Supabase
  async function setClients(updater){
    const next=typeof updater==='function'?updater(clients):updater;
    setClientsState(next);
    for(const c of next){
      await sb.from('clients').upsert({id:c.id,first_name:c.firstName,last_name:c.lastName,phone:c.phone||'',email:c.email||'',address:c.address||'',notes:c.notes||''});
      // Sync pets
      await sb.from('pets').delete().eq('client_id',c.id);
      if((c.pets||[]).length>0){
        await sb.from('pets').insert(c.pets.map(p=>({id:p.id,client_id:c.id,name:p.name,animal_type:p.animalType,breed:p.breed||'',age:p.age||'',special_notes:p.specialNotes||'',food_pref:p.foodPref||''})));
      }
      // Sync resources
      const {error:delResErr}=await sb.from('client_resources').delete().eq('client_id',c.id);
      if(delResErr) console.error('client_resources delete error:',delResErr);
      if((c.resources||[]).length>0){
        const {error:insResErr}=await sb.from('client_resources').insert(c.resources.map(r=>({id:r.id,client_id:c.id,type:r.type,date:r.date||null,phone:r.phone||null,notes:r.notes||null,offered:r.offered||null,status:r.status||null})));
        if(insResErr) console.error('client_resources insert error:',insResErr);
      }
    }
    const ids=next.map(c=>c.id);
    const removed=clients.map(c=>c.id).filter(id=>!ids.includes(id));
    for(const id of removed) await sb.from('clients').delete().eq('id',id);
  }

  const pendingCount=batches.filter(b=>b.status==='pending').length;
  const pendingRequestCount=requests.filter(r=>r.status==='pending').length;
  const inv=useMemo(()=>{const m={};inventory.forEach(i=>m[i.productId]=i.qty);return m;},[inventory]);
  const outCount=useMemo(()=>[...CAT_CATEGORIES.map(c=>({a:'Cat',c})),...DOG_CATEGORIES.map(c=>({a:'Dog',c}))].filter(({a,c})=>{const ps=products.filter(p=>p.animalType===a&&p.category===c);return ps.length>0&&ps.every(p=>(inv[p.id]||0)===0);}).length,[products,inv]);

  function handleLogin(username){setCurrentUser(username);}
  function handleLogout(){setCurrentUser(null);setPage('dashboard');}
  function navigate(pg,params){setPage(pg);setPageParams(params||null);}

  if(!currentUser) return <LoginPage onLogin={handleLogin}/>;
  if(loading) return(<div style={{minHeight:'100vh',background:'var(--navy-dark)',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:16}}><div style={{fontSize:52}}>🐾</div><div style={{color:'var(--gold)',fontSize:20,fontWeight:700}}>Loading Pet Pantry…</div><div style={{color:'rgba(255,255,255,.5)',fontSize:14}}>Connecting to database</div></div>);
  if(dbError) return(<div style={{minHeight:'100vh',background:'var(--navy-dark)',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:16,padding:24}}><div style={{fontSize:48}}>⚠️</div><div style={{color:'var(--gold)',fontSize:18,fontWeight:700}}>Database Connection Error</div><div style={{color:'rgba(255,255,255,.7)',fontSize:14,textAlign:'center',maxWidth:400}}>{dbError}</div><button className="btn btn-gold" onClick={loadAll}>Retry</button></div>);

  const NAV=[
    {id:'dashboard',icon:'🏠',label:'Dashboard'},
    {section:'Donations'},
    {id:'receive',icon:'📥',label:'Receive Donations'},
    {id:'batch-review',icon:'📋',label:'Batch Review',badge:pendingCount},
    {section:'Inventory'},
    {id:'inventory',icon:'📦',label:'Inventory',badge:outCount?`${outCount} out`:null},
    {id:'stock-count',icon:'🔢',label:'Stock Count'},
    {id:'products',icon:'🏷',label:'Product Master'},
    {id:'adjustments',icon:'📊',label:'Adjustments'},
    {section:'Clients'},
    {id:'clients',icon:'👥',label:'Clients'},
    {id:'requests',icon:'📝',label:'Requests',badge:pendingRequestCount||null},
    {id:'pickup',icon:'🛍',label:'Record Pickup'},
    {section:'System'},
    {id:'ledger',icon:'💰',label:'Ledger'},
    {id:'reports',icon:'📈',label:'Reports'},
    {id:'settings',icon:'⚙️',label:'Settings'},
  ];
  const PAGE_TITLES={dashboard:'Dashboard',receive:'Receive Donations','batch-review':'Batch Review',inventory:'Inventory','stock-count':'Stock Count',products:'Product Master',adjustments:'Adjustments Log',clients:'Clients',requests:'Requests',pickup:'Record Pickup',ledger:'Financial Ledger',reports:'Reports',settings:'Settings'};

  function renderPage(){
    const props={products,setProducts,inventory,setInventory,batches,setBatches,distributions,setDistributions,clients,setClients,requests,setRequests,navigate,params:pageParams};
    switch(page){
      case 'dashboard': return <Dashboard {...props}/>;
      case 'receive': return <ReceiveDonations {...props}/>;
      case 'batch-review': return <BatchReview {...props}/>;
      case 'inventory': return <Inventory {...props}/>;
      case 'products': return <ProductMaster {...props}/>;
      case 'stock-count': return <StockCountHub products={products} setProducts={setProducts} inventory={inventory} setInventory={setInventory}/>;
      case 'adjustments': return <AdjustmentsLog products={products}/>;
      case 'clients': return <Clients {...props}/>;
      case 'requests': return <Requests {...props}/>;
      case 'pickup': return <RecordPickup {...props}/>;
      case 'ledger': return <Ledger ledger={ledger} setLedger={setLedgerState} currentUser={currentUser}/>;
      case 'reports': return <Reports products={products} inventory={inventory} batches={batches} distributions={distributions} clients={clients}/>;
      case 'settings': return <Settings loadAll={loadAll}/>;
      default: return <Dashboard {...props}/>;
    }
  }

  return(
    <>
      <nav className="sidebar">
        <div className="sidebar-logo"><div style={{fontSize:36}}>🐾</div><div className="sidebar-logo-text">DELC Pet Pantry</div><div className="sidebar-logo-sub">Duncansville ELC</div></div>
        {NAV.map((item,i)=>{if(item.section)return <div key={i} className="sidebar-section"><div className="sidebar-section-label">{item.section}</div></div>;return(<button key={item.id} className={`nav-item ${page===item.id?'active':''}`} onClick={()=>navigate(item.id)}><span className="icon">{item.icon}</span><span>{item.label}</span>{item.badge?<span style={{marginLeft:'auto',background:'var(--red)',color:'white',borderRadius:10,fontSize:10,padding:'2px 6px',fontWeight:700}}>{item.badge}</span>:null}</button>);})}
      </nav>
      <div className="main">
        <div className="topbar">
          <span className="topbar-title">{PAGE_TITLES[page]||page}</span>
          <div style={{display:'flex',gap:8,alignItems:'center'}}>
            {outCount>0&&<span className="badge badge-out">🚫 {outCount} categor{outCount===1?'y':'ies'} out</span>}
            {pendingCount>0&&<span className="badge badge-pending">⏳ {pendingCount} Pending</span>}
            <div style={{display:'flex',alignItems:'center',gap:8,marginLeft:8,paddingLeft:12,borderLeft:'1px solid var(--gray-200)'}}>
              <span style={{fontSize:13,color:'var(--gray-600)'}}>👤 <strong>{currentUser}</strong></span>
              <button className="btn btn-sm btn-outline" onClick={handleLogout}>Sign Out</button>
            </div>
          </div>
        </div>
        {renderPage()}
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
