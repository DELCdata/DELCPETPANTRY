              {res.offered&&<div className="text-xs text-muted">Offered/Given: {res.offered}</div>}
              {res.notes&&<div className="text-xs text-muted">📝 {res.notes}</div>}
            </div>
            <button className="btn btn-sm btn-outline" onClick={()=>{setEditRes(res);setResForm({type:res.type,date:res.date,phone:res.phone,notes:res.notes,offered:res.offered,status:res.status||null});setResModal(true);}}>Edit</button>
            <button className="btn btn-sm btn-danger" onClick={()=>setForm(f=>({...f,resources:f.resources.filter(r=>r.id!==res.id)}))}>✕</button>
          </div>
        ))}

        <div style={{display:'flex',gap:10,justifyContent:'flex-end',marginTop:14}}>
          <button className="btn btn-outline" onClick={onCancel}>Cancel</button>
          <button className="btn btn-primary" onClick={()=>{if(!form.firstName||!form.lastName){alert('Name required');return;}onSave(form);}}>Save Client</button>
        </div>

        {/* Pet Modal */}
        <Modal show={petModal} title={editPet?'Edit Animal':'Add Animal'} onClose={()=>setPetModal(false)}
          footer={<><button className="btn btn-outline" onClick={()=>setPetModal(false)}>Cancel</button><button className="btn btn-primary" onClick={savePet}>Save Animal</button></>}>
          <div className="grid-2">
            <div className="form-group"><label className="form-label">Name *</label><input className="form-control" value={petForm.name} onChange={e=>setPetForm(f=>({...f,name:e.target.value}))}/></div>
            <div className="form-group"><label className="form-label">Animal Type</label><select className="form-control" value={petForm.animalType} onChange={e=>setPetForm(f=>({...f,animalType:e.target.value}))}>{ANIMAL_TYPES.map(t=><option key={t}>{t}</option>)}</select></div>
            <div className="form-group"><label className="form-label">Breed</label><input className="form-control" value={petForm.breed} onChange={e=>setPetForm(f=>({...f,breed:e.target.value}))}/></div>
            <div className="form-group"><label className="form-label">Age</label><input className="form-control" value={petForm.age} onChange={e=>setPetForm(f=>({...f,age:e.target.value}))}/></div>
          </div>
          <div className="form-group"><label className="form-label">Food Preferences</label><input className="form-control" value={petForm.foodPref} onChange={e=>setPetForm(f=>({...f,foodPref:e.target.value}))}/></div>
          <div className="form-group"><label className="form-label">Special Notes</label><textarea className="form-control" rows={2} value={petForm.specialNotes} onChange={e=>setPetForm(f=>({...f,specialNotes:e.target.value}))}/></div>
        </Modal>

        {/* Resource Modal */}
        <Modal show={resModal} title={editRes?'Edit Resource Request':'Add Resource Request'} onClose={()=>setResModal(false)}
          footer={<><button className="btn btn-outline" onClick={()=>setResModal(false)}>Cancel</button><button className="btn btn-gold" onClick={saveResource}>Save Resource</button></>}>
          <div className="grid-2">
            <div className="form-group">
              <label className="form-label">Resource Type *</label>
              <select className="form-control" value={resForm.type} onChange={e=>setResForm(f=>({...f,type:e.target.value}))}>
                {RESOURCE_TYPES.map(t=><option key={t}>{t}</option>)}
              </select>
            </div>
            <div className="form-group">
              <label className="form-label">Date</label>
              <input type="date" className="form-control" value={resForm.date} onChange={e=>setResForm(f=>({...f,date:e.target.value}))}/>
            </div>
            <div className="form-group">
              <label className="form-label">Phone Called From</label>
              <input className="form-control" value={resForm.phone} onChange={e=>setResForm(f=>({...f,phone:e.target.value}))} placeholder="(555) 555-5555"/>
            </div>
            <div className="form-group">
              <label className="form-label">Resources Offered / Given</label>
              <input className="form-control" value={resForm.offered} onChange={e=>setResForm(f=>({...f,offered:e.target.value}))} placeholder="What was provided (even if partial)"/>
            </div>
          </div>
          <div className="form-group">
            <label className="form-label">Outcome</label>
            <div style={{display:'flex',gap:10}}>
              <button type="button" onClick={()=>setResForm(f=>({...f,status:f.status==='given'?null:'given'}))}
                style={{flex:1,padding:'11px',borderRadius:'var(--radius)',border:'1.5px solid',cursor:'pointer',fontWeight:700,fontSize:14,transition:'all .15s',
                  borderColor:resForm.status==='given'?'var(--green)':'var(--gray-200)',
                  background:resForm.status==='given'?'var(--green-light)':'var(--white)',
                  color:resForm.status==='given'?'var(--green)':'var(--gray-600)'}}>
                ✅ We Helped
              </button>
              <button type="button" onClick={()=>setResForm(f=>({...f,status:f.status==='unable'?null:'unable'}))}
                style={{flex:1,padding:'11px',borderRadius:'var(--radius)',border:'1.5px solid',cursor:'pointer',fontWeight:700,fontSize:14,transition:'all .15s',
                  borderColor:resForm.status==='unable'?'var(--red)':'var(--gray-200)',
                  background:resForm.status==='unable'?'var(--red-light)':'var(--white)',
                  color:resForm.status==='unable'?'var(--red)':'var(--gray-600)'}}>
                ❌ Unable to Fully Help
              </button>
            </div>
            <div className="text-xs text-muted mt-2">You can still fill in "Resources Offered" above even if unable to fully help.</div>
          </div>
          <div className="form-group">
            <label className="form-label">Notes</label>
            <textarea className="form-control" rows={3} value={resForm.notes} onChange={e=>setResForm(f=>({...f,notes:e.target.value}))} placeholder="Additional details…"/>
          </div>
        </Modal>
      </div>
    );
  }

  function saveClient(form){
    if(editClient){setClients(prev=>prev.map(c=>c.id===editClient.id?{...c,...form}:c));}
    else{setClients(prev=>[...prev,{...form,id:uid()}]);}
    setShowModal(false);setEditClient(null);
  }

  // ── CLIENT DETAIL VIEW ───────────────────────────────────────────────────
  if(selectedClient){
    const cl=clients.find(c=>c.id===selectedClient.id)||selectedClient;
    const clDists=distributions.filter(d=>d.clientId===cl.id).sort((a,b)=>b.date.localeCompare(a.date));
    return(
      <div className="page">
        <div className="section-header mb-4">
          <button className="btn btn-outline" onClick={()=>setSelectedClient(null)}>← Back to Clients</button>
          <div style={{display:'flex',gap:8}}>
            <button className="btn btn-outline" onClick={()=>{setEditClient(cl);setShowModal(true)}}>Edit Client</button>
            <button className="btn btn-gold" onClick={()=>navigate('pickup',{clientId:cl.id})}>🛍 Record Pickup</button>
            <button className="btn btn-danger" onClick={()=>setDeleteConfirm(cl.id)}>🗑 Delete</button>
          </div>
        </div>

        {/* Info + Animals row */}
        <div className="grid-2 mb-4">
          <div className="card">
            <div className="card-header"><span className="card-title">👤 {cl.firstName} {cl.lastName}</span></div>
            {cl.phone&&<div className="text-sm mb-2">📞 {cl.phone}</div>}
            {cl.email&&<div className="text-sm mb-2">✉️ {cl.email}</div>}
            {cl.address&&<div className="text-sm mb-2">📍 {cl.address}</div>}
            {cl.notes&&<div className="alert alert-info mt-3 text-sm">{cl.notes}</div>}
          </div>
          <div className="card">
            <div className="card-header"><span className="card-title">🐾 Animals ({cl.pets?.length||0})</span></div>
            {(cl.pets||[]).length===0&&<div className="text-sm text-muted">No animals on file.</div>}
            {(cl.pets||[]).map(pet=>(
              <div key={pet.id} style={{padding:'10px 0',borderBottom:'1px solid var(--gray-100)'}}>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <span style={{fontSize:20}}>{pet.animalType==='Cat'?'🐱':pet.animalType==='Dog'?'🐶':'🐾'}</span>
                  <div><div className="font-bold text-sm">{pet.name}</div><div className="text-xs text-muted">{pet.breed||'Unknown'} · Age: {pet.age||'?'}</div></div>
                </div>
                {pet.foodPref&&<div className="text-xs text-muted mt-1">🍽 {pet.foodPref}</div>}
                {pet.specialNotes&&<div className="text-xs text-muted">📝 {pet.specialNotes}</div>}
              </div>
            ))}
          </div>
        </div>

        {/* ── RESOURCE REQUESTS CARD ── */}
        <div className="card mb-4">
          <div className="card-header">
            <span className="card-title">📋 Resource Requests ({(cl.resources||[]).length})</span>
            <button className="btn btn-sm btn-gold" onClick={()=>{setEditClient(cl);setShowModal(true);}}>+ Add Resource</button>
          </div>
          {(cl.resources||[]).length===0&&<div className="text-sm text-muted">No resource requests on file.</div>}
          <div style={{display:'grid',gap:10}}>
            {(cl.resources||[]).map(r=>(
              <div key={r.id} style={{display:'flex',alignItems:'flex-start',gap:14,padding:'14px',border:`1.5px solid ${RESOURCE_COLOR[r.type]||'var(--gray-200)'}44`,borderRadius:'var(--radius)',background:r.type?`${RESOURCE_COLOR[r.type]}08`:''}}>
                <span style={{fontSize:30,lineHeight:1}}>{RESOURCE_ICON[r.type]||'📋'}</span>
                <div style={{flex:1}}>
                  <div style={{fontWeight:700,fontSize:16,color:RESOURCE_COLOR[r.type]||'var(--gray-800)'}}>{r.type}</div>
                  <div className="text-xs text-muted" style={{marginTop:3}}>
                    {r.date&&<span>{fmtDate(r.date)}</span>}
                    {r.phone&&<span> · 📞 Called from: {r.phone}</span>}
                  </div>
                  {r.status==='given'&&<div className="text-sm mt-2" style={{color:'var(--green)',fontWeight:700}}>✅ We helped</div>}
                  {r.status==='unable'&&<div className="text-sm mt-2" style={{color:'var(--red)',fontWeight:700}}>❌ Unable to fully help</div>}
                  {r.offered&&<div className="text-sm mt-1" style={{color:'var(--gray-600)'}}>Offered/Given: {r.offered}</div>}
                  {r.notes&&<div className="text-sm mt-1" style={{color:'var(--gray-600)'}}>📝 {r.notes}</div>}
                </div>
              </div>
            ))}
          </div>
        </div>

        {/* Pickup History */}
        <div className="card">
          <div className="card-header"><span className="card-title">📦 Pickup History ({clDists.length})</span></div>
          {clDists.length===0&&<div className="empty-state" style={{padding:24}}><div className="icon">🛍</div><h3>No pickups yet</h3></div>}
          {clDists.map(d=>{
            const totalUnits=d.items.reduce((s,i)=>s+i.qty,0);
            return(
              <div key={d.id} style={{borderBottom:'1px solid var(--gray-100)',padding:'12px 0'}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
                  <div><span className="font-bold text-sm">{fmtDate(d.date)}</span><span className="text-xs text-muted" style={{marginLeft:10}}>{d.items.length} product{d.items.length!==1?'s':''} · {totalUnits} unit{totalUnits!==1?'s':''}</span>{d.notes&&<span className="text-xs text-muted" style={{marginLeft:10}}>· {d.notes}</span>}</div>
                  <div style={{display:'flex',gap:6}}><button className="btn btn-sm btn-outline" onClick={()=>openEditDist(d)}>✏️ Edit</button><button className="btn btn-sm btn-danger" onClick={()=>setDeleteDistConfirm(d.id)}>🗑</button></div>
                </div>
                <div style={{display:'flex',flexDirection:'column',gap:4,paddingLeft:10,borderLeft:'3px solid var(--gray-200)'}}>
                  {d.items.map((item,idx)=>{const p=products.find(p=>p.id===item.productId);return(<div key={idx} style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}><div><span className="text-sm">{p?p.name:<span className="text-muted">Unknown product</span>}</span>{p&&<span className="text-xs text-muted" style={{marginLeft:8}}>{p.brand}{p.size?` · ${p.size}`:''}</span>}</div><div style={{display:'flex',alignItems:'center',gap:8}}>{p&&animalBadge(p.animalType)}<span className="badge badge-pending">×{item.qty}</span></div></div>);})}
                </div>
              </div>
            );
          })}
        </div>

        {/* Edit Distribution Modal */}
        {editDist&&(
          <Modal show onClose={closeEditDist} title={`Edit Pickup — ${fmtDate(editDist.date)}`} wide
            footer={<><button className="btn btn-outline" onClick={closeEditDist}>Cancel</button><button className="btn btn-success" onClick={()=>setEditConfirm(true)} disabled={editDistItems.length===0}>✅ Save Changes</button></>}>
            <div className="alert alert-info mb-3">You can add new items, adjust quantities, or remove items. Inventory will be updated automatically to reflect the difference.</div>
            <div className="grid-2 mb-3"><div className="form-group" style={{margin:0}}><label className="form-label">Pickup Date</label><input type="date" className="form-control" value={editDistDate} onChange={e=>setEditDistDate(e.target.value)}/></div><div className="form-group" style={{margin:0}}><label className="form-label">Notes</label><input className="form-control" value={editDistNotes} onChange={e=>setEditDistNotes(e.target.value)} placeholder="Optional notes"/></div></div>
            <div className="upc-bar mb-3" style={{padding:12}}><span style={{color:'var(--gold)',fontWeight:700,fontSize:13}}>📡 Add by UPC</span><input className="upc-input" style={{fontSize:14,padding:'8px 12px'}} placeholder="Scan or type UPC…" value={editUpcInput} onChange={e=>setEditUpcInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&editDistAddByUPC()}/><button className="btn btn-gold btn-sm" onClick={editDistAddByUPC}>Add</button></div>
            <div style={{marginBottom:12}}>{editDistItems.length===0&&<div className="text-sm text-muted">No items — add some above.</div>}{editDistItems.map((item,idx)=>{const p=products.find(p=>p.id===item.productId);const origItem=editDist.items.find(i=>i.productId===item.productId);const origQty=origItem?.qty||0;return(<div key={item.id} className="batch-line"><div style={{flex:1}}><div className="font-bold text-sm">{p?.name||'Unknown'}</div><div className="text-xs text-muted">{p?.brand} {p?.size&&`· ${p.size}`}{origQty>0&&<span style={{marginLeft:8,color:'var(--gray-400)'}}>Originally: {origQty}</span>}</div></div><div className="qty-controls"><button className="qty-btn" onClick={()=>setEditDistItems(prev=>prev.map((it,i)=>i===idx?{...it,qty:Math.max(1,it.qty-1)}:it))}>−</button><input className="qty-num form-control" type="number" min={1} value={item.qty} onChange={e=>setEditDistItems(prev=>prev.map((it,i)=>i===idx?{...it,qty:parseInt(e.target.value)||1}:it))}/><button className="qty-btn" onClick={()=>setEditDistItems(prev=>prev.map((it,i)=>i===idx?{...it,qty:it.qty+1}:it))}>+</button></div><button className="btn btn-sm btn-danger" onClick={()=>setEditDistItems(prev=>prev.filter((_,i)=>i!==idx))}>✕</button></div>);})}</div>
            <div><div className="text-xs text-muted font-bold mb-2" style={{textTransform:'uppercase',letterSpacing:'.05em'}}>Quick Add from Inventory</div><div style={{maxHeight:180,overflowY:'auto',border:'1px solid var(--gray-200)',borderRadius:'var(--radius)'}}>{products.filter(p=>{const alreadyIn=editDistItems.find(i=>i.productId===p.id);const origItem=editDist.items.find(i=>i.productId===p.id);const effectiveStock=(inv[p.id]||0)+(origItem?.qty||0);return effectiveStock>0||alreadyIn;}).map(p=>{const origItem=editDist.items.find(i=>i.productId===p.id);const effectiveStock=(inv[p.id]||0)+(origItem?.qty||0);return(<div key={p.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'7px 12px',borderBottom:'1px solid var(--gray-100)',cursor:'pointer'}} onClick={()=>editDistAddProduct(p)}><div><span className="text-sm font-bold">{p.name}</span><span className="text-xs text-muted" style={{marginLeft:8}}>{p.animalType} · {p.category}</span></div><div style={{display:'flex',gap:8,alignItems:'center'}}><span className="text-xs text-muted">{effectiveStock} avail.</span><button className="btn btn-sm btn-outline" onClick={e=>{e.stopPropagation();editDistAddProduct(p);}}>+ Add</button></div></div>);})}</div></div>
          </Modal>
        )}

        <ConfirmModal show={editConfirm} message="Save changes to this pickup? Inventory will be adjusted to reflect any differences from the original." onConfirm={saveEditDist} onCancel={()=>setEditConfirm(false)}/>
        <ConfirmModal show={!!deleteDistConfirm} message="Delete this pickup record? Items will be returned to inventory." onConfirm={()=>deleteDistribution(deleteDistConfirm)} onCancel={()=>setDeleteDistConfirm(null)}/>

        <Modal show={showModal} onClose={()=>{setShowModal(false);setEditClient(null)}} title="Edit Client" wide>
          <ClientForm client={editClient} onSave={saveClient} onCancel={()=>{setShowModal(false);setEditClient(null)}}/>
        </Modal>

        {deleteConfirm&&selectedClient?.id===deleteConfirm&&(()=>{
          const dc=clients.find(c=>c.id===deleteConfirm);
          const dcDists=distributions.filter(d=>d.clientId===deleteConfirm);
          return(
            <Modal show onClose={()=>setDeleteConfirm(null)} title={`Delete ${dc?.firstName||''} ${dc?.lastName||''}?`}
              footer={<>
                <button className="btn btn-outline" onClick={()=>setDeleteConfirm(null)}>Cancel — Keep Client</button>
                {dcDists.length>0&&<button className="btn btn-outline" onClick={()=>{printClientHistory(deleteConfirm);deleteClient(deleteConfirm);}}>🖨 Print History &amp; Delete</button>}
                <button className="btn btn-danger" onClick={()=>deleteClient(deleteConfirm)}>🗑 Delete Without Printing</button>
              </>}>
              {dcDists.length>0?(
                <div><div className="alert alert-warning mb-3">⚠️ <strong>{dc?.firstName} {dc?.lastName}</strong> has <strong>{dcDists.length} pickup record{dcDists.length!==1?'s':''}</strong> on file. Deleting will permanently remove this client and all their history.</div><div className="text-sm mb-2">Would you like to <strong>print their history</strong> before deleting?</div><div className="text-xs text-muted">The print option will open a printable summary of all their visits, then delete the record.</div></div>
              ):(
                <div className="text-sm">This client has no pickup history. Are you sure you want to delete them?</div>
              )}
            </Modal>
          );
        })()}
      </div>
    );
  }

  // ── CLIENT LIST VIEW ─────────────────────────────────────────────────────
  return(
    <div className="page">
      <div className="section-header mb-4">
        <div className="section-title">👥 Clients ({clients.length})</div>
        <button className="btn btn-primary" onClick={()=>{setEditClient(null);setShowModal(true)}}>+ Add Client</button>
      </div>
      <div className="search-bar mb-4">
        <input className="form-control" placeholder="Search by name, phone, or email…" value={search} onChange={e=>setSearch(e.target.value)}/>
      </div>
      <div className="grid-3">
        {filtered.length===0&&<div className="card" style={{gridColumn:'1/-1'}}><div className="empty-state"><div className="icon">👥</div><h3>No clients found</h3></div></div>}
        {filtered.map(c=>(
          <div key={c.id} className="client-card" onClick={()=>setSelectedClient(c)}>
            <div style={{display:'flex',gap:12,alignItems:'flex-start'}}>
              <div className="client-avatar">{c.firstName[0]}{c.lastName[0]}</div>
              <div style={{flex:1}}>
                <div className="font-bold">{c.firstName} {c.lastName}</div>
                {c.phone&&<div className="text-sm text-muted">📞 {c.phone}</div>}
                {c.email&&<div className="text-sm text-muted" style={{fontSize:12}}>✉️ {c.email}</div>}
                {/* Pet badges */}
                {(c.pets||[]).length>0&&(
                  <div style={{marginTop:6,display:'flex',gap:6,flexWrap:'wrap'}}>
                    {(c.pets||[]).map(pet=>(
                      <span key={pet.id} className={`badge ${pet.animalType==='Cat'?'badge-cat':pet.animalType==='Dog'?'badge-dog':'badge-other'}`}>
                        {pet.animalType==='Cat'?'🐱':pet.animalType==='Dog'?'🐶':'🐾'} {pet.name}
                      </span>
                    ))}
                  </div>
                )}
                {/* Resource badges */}
                {(c.resources||[]).length>0&&(
                  <div style={{marginTop:5,display:'flex',gap:4,flexWrap:'wrap'}}>
                    {(c.resources||[]).map(r=>(
                      <span key={r.id} style={{display:'inline-flex',alignItems:'center',gap:3,padding:'2px 8px',borderRadius:20,fontSize:11,fontWeight:700,background:`${RESOURCE_COLOR[r.type]||'#6b7280'}15`,color:RESOURCE_COLOR[r.type]||'var(--gray-600)',border:`1px solid ${RESOURCE_COLOR[r.type]||'var(--gray-200)'}55`}}>
                        {RESOURCE_ICON[r.type]||'📋'} {r.type}
                      </span>
                    ))}
                  </div>
                )}
              </div>
              <button className="btn btn-sm btn-danger" style={{flexShrink:0}} onClick={e=>{e.stopPropagation();setDeleteConfirm(c.id);}} title="Delete client">🗑</button>
            </div>
          </div>
        ))}
      </div>
      <Modal show={showModal} onClose={()=>{setShowModal(false);setEditClient(null)}} title={editClient?'Edit Client':'Add New Client'} wide>
        <ClientForm client={editClient} onSave={saveClient} onCancel={()=>{setShowModal(false);setEditClient(null)}}/>
      </Modal>
      {deleteConfirm&&!selectedClient&&(()=>{
        const dc=clients.find(c=>c.id===deleteConfirm);
        const dcDists=distributions.filter(d=>d.clientId===deleteConfirm);
        return(
          <Modal show onClose={()=>setDeleteConfirm(null)} title={`Delete ${dc?.firstName||''} ${dc?.lastName||''}?`}
            footer={<>
              <button className="btn btn-outline" onClick={()=>setDeleteConfirm(null)}>Cancel — Keep Client</button>
              {dcDists.length>0&&<button className="btn btn-outline" onClick={()=>{printClientHistory(deleteConfirm);deleteClient(deleteConfirm);}}>🖨 Print History &amp; Delete</button>}
              <button className="btn btn-danger" onClick={()=>deleteClient(deleteConfirm)}>🗑 Delete Without Printing</button>
            </>}>
            {dcDists.length>0?(
              <div><div className="alert alert-warning mb-3">⚠️ <strong>{dc?.firstName} {dc?.lastName}</strong> has <strong>{dcDists.length} pickup record{dcDists.length!==1?'s':''}</strong> on file.</div><div className="text-sm mb-2">Would you like to <strong>print their history</strong> before deleting?</div><div className="text-xs text-muted">The print option will open a printable summary of all their visits, then delete the record.</div></div>
            ):(
              <div className="text-sm">This client has no pickup history. Are you sure you want to delete them?</div>
            )}
          </Modal>
        );
      })()}
    </div>
  );
}

// ── RECORD PICKUP ─────────────────────────────────────────────────────────────
function RecordPickup({clients,products,inventory,setInventory,distributions,setDistributions,params,navigate}){
  const [search,setSearch]=useState('');const [selectedClient,setSelectedClient]=useState(null);const [upcInput,setUpcInput]=useState('');const [items,setItems]=useState([]);const [pickupDate,setPickupDate]=useState(today());const [notes,setNotes]=useState('');const [confirm,setConfirm]=useState(false);
  const upcRef=useRef(null);
  const inv=useMemo(()=>{const m={};inventory.forEach(i=>m[i.productId]=i.qty);return m;},[inventory]);
  const prodMap=useMemo(()=>{const m={};products.forEach(p=>m[p.id]=p);return m;},[products]);
  useEffect(()=>{if(params?.clientId){const cl=clients.find(c=>c.id===params.clientId);if(cl)setSelectedClient(cl);}},[params]);
  const clientsFiltered=clients.filter(c=>{const q=search.toLowerCase();return !q||(c.firstName+' '+c.lastName+c.phone+c.email).toLowerCase().includes(q);});
  function addByUPC(){const code=upcInput.trim();if(!code)return;const prod=products.find(p=>p.upc===code);if(!prod){alert('Product not found in master. Please add it first.');return;}const existing=items.findIndex(i=>i.productId===prod.id);if(existing>=0){setItems(prev=>prev.map((it,i)=>i===existing?{...it,qty:it.qty+1}:it));}else{setItems(prev=>[...prev,{id:uid(),productId:prod.id,qty:1,notes:''}]);}setUpcInput('');upcRef.current?.focus();}
  function addByProduct(p){const existing=items.findIndex(i=>i.productId===p.id);if(existing>=0){setItems(prev=>prev.map((it,i)=>i===existing?{...it,qty:it.qty+1}:it));}else{setItems(prev=>[...prev,{id:uid(),productId:p.id,qty:1,notes:''}]);}}
  function finalizePickup(){if(!selectedClient){alert('Select a client first.');return;}if(items.length===0){alert('No items selected.');return;}for(const item of items){if((inv[item.productId]||0)<item.qty){const p=prodMap[item.productId];alert(`Insufficient stock for ${p?.name}. Only ${inv[item.productId]||0} available.`);return;}}const dist={id:uid(),clientId:selectedClient.id,date:pickupDate,notes,items:items.map(i=>({productId:i.productId,qty:i.qty,notes:i.notes}))};const updates={};items.forEach(i=>{updates[i.productId]=(updates[i.productId]||0)+i.qty;});setInventory(prev=>prev.map(i=>updates[i.productId]!==undefined?{...i,qty:i.qty-updates[i.productId]}:i));setDistributions(prev=>[dist,...prev]);setItems([]);setNotes('');setConfirm(false);alert(`Pickup recorded for ${selectedClient.firstName} ${selectedClient.lastName}! ✅`);navigate('clients',{clientId:selectedClient.id});}
  if(!selectedClient){return(<div className="page"><div className="section-header mb-4"><div className="section-title">🛍 Record Pickup — Select Client</div></div><div className="search-bar mb-4"><input className="form-control lg" placeholder="Search client by name, phone, or email…" value={search} onChange={e=>setSearch(e.target.value)} autoFocus/></div><div className="grid-3">{clientsFiltered.length===0&&<div className="card" style={{gridColumn:'1/-1'}}><div className="empty-state"><div className="icon">👥</div><h3>No clients found</h3></div></div>}{clientsFiltered.map(c=>(<div key={c.id} className="client-card" onClick={()=>setSelectedClient(c)}><div style={{display:'flex',gap:12,alignItems:'center'}}><div className="client-avatar">{c.firstName[0]}{c.lastName[0]}</div><div><div className="font-bold">{c.firstName} {c.lastName}</div>{c.phone&&<div className="text-sm text-muted">{c.phone}</div>}<div className="text-xs text-muted">{(c.pets||[]).length} animal{(c.pets||[]).length!==1?'s':''}</div></div></div></div>))}</div><div className="mt-4"><button className="btn btn-outline" onClick={()=>navigate('clients')}>+ Add New Client First</button></div></div>);}
  return(
    <div className="page">
      <div className="section-header mb-4"><div><div className="section-title">🛍 Record Pickup</div><div className="text-sm text-muted">{selectedClient.firstName} {selectedClient.lastName}</div></div><div style={{display:'flex',gap:8}}><button className="btn btn-outline" onClick={()=>{setSelectedClient(null);setItems([])}}>← Change Client</button><button className="btn btn-success btn-lg" onClick={()=>setConfirm(true)} disabled={items.length===0}>✅ Complete Pickup</button></div></div>
      <div className="grid-2 mb-4"><div className="card"><div className="card-header"><span className="card-title">👤 {selectedClient.firstName} {selectedClient.lastName}</span></div>{selectedClient.phone&&<div className="text-sm mb-1">📞 {selectedClient.phone}</div>}{(selectedClient.pets||[]).map(pet=>(<div key={pet.id} className="text-sm mb-1">{pet.animalType==='Cat'?'🐱':pet.animalType==='Dog'?'🐶':'🐾'} <strong>{pet.name}</strong> — {pet.breed||pet.animalType}{pet.foodPref&&<span className="text-muted"> · Prefers: {pet.foodPref}</span>}</div>))}</div><div><div className="form-group"><label className="form-label">Pickup Date</label><input type="date" className="form-control" value={pickupDate} onChange={e=>setPickupDate(e.target.value)}/></div><div className="form-group"><label className="form-label">Notes</label><textarea className="form-control" value={notes} onChange={e=>setNotes(e.target.value)} rows={2}/></div></div></div>
      <div className="upc-bar mb-4"><span style={{color:'var(--gold)',fontWeight:700,fontSize:15}}>📡 Scan Item</span><input ref={upcRef} className="upc-input" placeholder="Scan UPC to add item…" value={upcInput} onChange={e=>setUpcInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addByUPC()} autoFocus/><button className="btn btn-gold" onClick={addByUPC}>Add</button></div>
      <div className="grid-2"><div className="card"><div className="card-header"><span className="card-title">Pickup Items ({items.length})</span></div>{items.length===0&&<div className="text-sm text-muted">No items added yet. Scan or click from inventory.</div>}{items.map(item=>{const p=prodMap[item.productId];const avail=inv[item.productId]||0;return(<div key={item.id} className="batch-line"><div style={{flex:1}}><div className="font-bold text-sm">{p?.name}</div><div className="text-xs text-muted">{p?.brand} · Available: {avail}</div></div><div className="qty-controls"><button className="qty-btn" onClick={()=>setItems(prev=>prev.map(i=>i.id===item.id?{...i,qty:Math.max(1,i.qty-1)}:i))}>−</button><input className="qty-num form-control" type="number" min={1} max={avail} value={item.qty} onChange={e=>setItems(prev=>prev.map(i=>i.id===item.id?{...i,qty:Math.min(avail,parseInt(e.target.value)||1)}:i))}/><button className="qty-btn" onClick={()=>setItems(prev=>prev.map(i=>i.id===item.id?{...i,qty:Math.min(avail,i.qty+1)}:i))}>+</button></div><button className="btn btn-sm btn-danger" onClick={()=>setItems(prev=>prev.filter(i=>i.id!==item.id))}>✕</button></div>);})}</div>
      <div className="card"><div className="card-header"><span className="card-title">Available Inventory</span></div><input className="form-control mb-3" placeholder="Filter products…" value={search} onChange={e=>setSearch(e.target.value)}/><div style={{maxHeight:320,overflowY:'auto'}}>{products.filter(p=>{const q=search.toLowerCase();return (!q||(p.name+p.brand).toLowerCase().includes(q))&&(inv[p.id]||0)>0;}).map(p=>(<div key={p.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'7px 0',borderBottom:'1px solid var(--gray-100)',cursor:'pointer'}} onClick={()=>addByProduct(p)}><div><div className="text-sm font-bold">{p.name}</div><div className="text-xs text-muted">{p.animalType} · {p.category}</div></div><div style={{display:'flex',gap:8,alignItems:'center'}}><span className="text-sm text-muted">{inv[p.id]} avail.</span><button className="btn btn-sm btn-outline">+ Add</button></div></div>))}</div></div></div>
      <ConfirmModal show={confirm} message={`Complete pickup for ${selectedClient.firstName} ${selectedClient.lastName}? ${items.length} item types, ${items.reduce((s,i)=>s+i.qty,0)} total units. Inventory will be updated immediately.`} onConfirm={finalizePickup} onCancel={()=>setConfirm(false)}/>
    </div>
  );
}

// ── REQUESTS ──────────────────────────────────────────────────────────────────
function Requests({clients,setClients,products,inventory,setInventory,distributions,setDistributions,requests,setRequests,navigate,params}){
  const [tab,setTab]=useState('pending');
  const [showNew,setShowNew]=useState(false);
  const [fulfilling,setFulfilling]=useState(null);
  const [confirm,setConfirm]=useState(null);
  const clientMap=useMemo(()=>{const m={};clients.forEach(c=>m[c.id]=c);return m;},[clients]);
  const counts=useMemo(()=>({pending:requests.filter(r=>r.status==='pending').length,fulfilled:requests.filter(r=>r.status==='fulfilled').length,cancelled:requests.filter(r=>r.status==='cancelled').length}),[requests]);
  const filtered=requests.filter(r=>r.status===tab).sort((a,b)=>b.date.localeCompare(a.date)||(b.createdAt||'').localeCompare(a.createdAt||''));

  useEffect(()=>{if(params?.requestId){const r=requests.find(x=>x.id===params.requestId);if(r&&r.status==='pending')setFulfilling(r);}},[params]);

  function cancelRequest(r){setConfirm({msg:`Cancel this request for ${clientMap[r.clientId]?`${clientMap[r.clientId].firstName} ${clientMap[r.clientId].lastName}`:'this client'}? This cannot be undone.`,cb:()=>{setRequests(prev=>prev.map(x=>x.id===r.id?{...x,status:'cancelled'}:x));setConfirm(null);}});}

  if(fulfilling){
    return <FulfillRequest request={fulfilling} client={clientMap[fulfilling.clientId]} products={products} inventory={inventory} setInventory={setInventory} distributions={distributions} setDistributions={setDistributions} requests={requests} setRequests={setRequests} onDone={()=>setFulfilling(null)} onCancel={()=>setFulfilling(null)}/>;
  }

  return(
    <div className="page">
      <div className="section-header mb-4"><div className="section-title">📝 Requests</div><button className="btn btn-primary btn-lg" onClick={()=>setShowNew(true)}>+ New Request</button></div>
      <div style={{display:'flex',gap:8,marginBottom:16}}>
        <button className={`btn ${tab==='pending'?'btn-primary':'btn-outline'}`} onClick={()=>setTab('pending')}>⏳ Pending{counts.pending?` (${counts.pending})`:''}</button>
        <button className={`btn ${tab==='fulfilled'?'btn-primary':'btn-outline'}`} onClick={()=>setTab('fulfilled')}>✅ Fulfilled{counts.fulfilled?` (${counts.fulfilled})`:''}</button>
        <button className={`btn ${tab==='cancelled'?'btn-primary':'btn-outline'}`} onClick={()=>setTab('cancelled')}>✕ Cancelled{counts.cancelled?` (${counts.cancelled})`:''}</button>
      </div>
      {filtered.length===0&&<div className="card"><div className="empty-state"><div className="icon">📝</div><h3>No {tab} requests</h3>{tab==='pending'&&<p>Click + New Request to take down a request over the phone or at the door.</p>}</div></div>}
      <div style={{display:'grid',gap:12}}>
        {filtered.map(r=>{
          const cl=clientMap[r.clientId];
          const petNames=[...new Set(r.items.map(i=>i.petName).filter(Boolean))];
          return(
            <div key={r.id} className="card">
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexWrap:'wrap',gap:10}}>
                <div>
                  <div className="font-bold" style={{fontSize:16}}>{cl?`${cl.firstName} ${cl.lastName}`:'Unknown Client'}</div>
                  <div className="text-sm text-muted">{cl?.phone||''}{petNames.length?` · 🐾 ${petNames.join(', ')}`:''}</div>
                  <div className="text-xs text-muted mt-1">Requested {fmtDate(r.date)}{r.method?` · ${r.method}`:''}{r.createdBy?` · Taken by ${r.createdBy}`:''}</div>
                </div>
                <div style={{display:'flex',gap:8,alignItems:'center'}}>
                  {r.status==='pending'&&<><button className="btn btn-sm btn-danger" onClick={()=>cancelRequest(r)}>Cancel</button><button className="btn btn-sm btn-success" onClick={()=>setFulfilling(r)}>📦 Fulfill</button></>}
                  {r.status==='fulfilled'&&<span className="badge badge-finalized">✅ Fulfilled{r.fulfilledAt?' '+fmtDate(r.fulfilledAt.slice(0,10)):''}</span>}
                  {r.status==='cancelled'&&<span className="badge" style={{background:'var(--red-light)',color:'var(--red)'}}>Cancelled</span>}
                </div>
              </div>
              <div style={{marginTop:10,display:'grid',gap:6}}>
                {r.items.map((it,idx)=>(<div key={idx} style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap',fontSize:13,padding:'6px 10px',background:'var(--gray-50)',borderRadius:'var(--radius)'}}>
                  {animalBadge(it.animalType)}
                  <span className="font-bold">{it.category}</span>
                  {it.petName&&<span className="text-muted">for {it.petName}</span>}
                  {it.description&&<span className="text-muted">— {it.description}</span>}
                  {it.qtyRequested?<span className="text-muted">(~{it.qtyRequested})</span>:null}
                </div>))}
              </div>
              {r.notes&&<div className="text-sm text-muted mt-2">📝 {r.notes}</div>}
            </div>
          );
        })}
      </div>
      <NewRequestModal show={showNew} onClose={()=>setShowNew(false)} clients={clients} setClients={setClients} setRequests={setRequests}/>
      <ConfirmModal show={!!confirm} message={confirm?.msg} onConfirm={confirm?.cb} onCancel={()=>setConfirm(null)}/>
    </div>
  );
}

function NewRequestModal({show,onClose,clients,setClients,setRequests}){
  const [clientSearch,setClientSearch]=useState('');
  const [selectedClient,setSelectedClient]=useState(null);
  const [showQuickAdd,setShowQuickAdd]=useState(false);
  const [qaFirst,setQaFirst]=useState('');const [qaLast,setQaLast]=useState('');const [qaPhone,setQaPhone]=useState('');
  const blankItem=()=>({id:uid(),petName:'',animalType:'Cat',category:'Dry Food',description:'',qtyRequested:''});
  const [items,setItems]=useState([blankItem()]);
  const [method,setMethod]=useState(REQUEST_METHODS[0]);
  const [reqDate,setReqDate]=useState(today());
  const [notes,setNotes]=useState('');
  const [createdBy,setCreatedBy]=useState('');
  const [saving,setSaving]=useState(false);

  useEffect(()=>{if(!show){setClientSearch('');setSelectedClient(null);setShowQuickAdd(false);setQaFirst('');setQaLast('');setQaPhone('');setItems([blankItem()]);setMethod(REQUEST_METHODS[0]);setReqDate(today());setNotes('');setCreatedBy('');}},[show]);

  const matches=useMemo(()=>{const q=clientSearch.trim().toLowerCase();if(!q)return[];return clients.filter(c=>(c.firstName+' '+c.lastName+' '+(c.phone||'')).toLowerCase().includes(q)).slice(0,8);},[clientSearch,clients]);

  async function quickAddClient(){
    if(!qaFirst.trim()||!qaLast.trim()){alert('First and last name required.');return;}
    const nc={id:uid(),firstName:qaFirst.trim(),lastName:qaLast.trim(),phone:qaPhone.trim(),email:'',address:'',notes:'',pets:[],resources:[]};
    await setClients(prev=>[...prev,nc]);
    setSelectedClient(nc);setShowQuickAdd(false);
  }

  function addItem(){setItems(prev=>[...prev,blankItem()]);}
  function updateItem(id,field,val){setItems(prev=>prev.map(it=>it.id===id?{...it,[field]:val,...(field==='animalType'?{category:getCatsForAnimal(val)[0]}:{})}:it));}
  function removeItem(id){setItems(prev=>prev.filter(it=>it.id!==id));}

  async function save(){
    if(!selectedClient){alert('Select or add a client first.');return;}
    const validItems=items.filter(it=>it.category);
    if(validItems.length===0){alert('Add at least one requested item.');return;}
    setSaving(true);
    const req={id:uid(),clientId:selectedClient.id,date:reqDate,status:'pending',method,notes:notes.trim(),createdBy:createdBy.trim(),createdAt:new Date().toISOString(),fulfilledAt:null,distributionId:null,items:validItems.map(it=>({petName:it.petName.trim(),animalType:it.animalType,category:it.category,description:it.description.trim(),qtyRequested:it.qtyRequested===''?null:(parseFloat(it.qtyRequested)||null)}))};
    await setRequests(prev=>[req,...prev]);
    setSaving(false);
    onClose();
  }

  return(
    <Modal show={show} onClose={onClose} title="📝 New Pet Pantry Request" wide>
      {!selectedClient?(
        <div>
          <div className="form-group"><label className="form-label">Find Client</label><input className="form-control lg" autoFocus placeholder="Search by name or phone…" value={clientSearch} onChange={e=>setClientSearch(e.target.value)}/></div>
          {matches.length>0&&<div className="table-wrap mb-3" style={{maxHeight:220,overflowY:'auto'}}><table><tbody>{matches.map(c=>(<tr key={c.id} style={{cursor:'pointer'}} onClick={()=>setSelectedClient(c)}><td><div className="font-bold text-sm">{c.firstName} {c.lastName}</div><div className="text-xs text-muted">{c.phone||''}{(c.pets||[]).length?` · ${c.pets.length} pet(s)`:''}</div></td><td style={{textAlign:'right'}}><button className="btn btn-sm btn-outline">Select</button></td></tr>))}</tbody></table></div>}
          {clientSearch.trim()&&matches.length===0&&<div className="alert alert-info mb-3">No matching client found.</div>}
          {!showQuickAdd?<button className="btn btn-outline" onClick={()=>setShowQuickAdd(true)}>+ Quick Add New Client</button>:(
            <div className="card" style={{background:'var(--gray-50)'}}>
              <div className="grid-3">
                <div className="form-group"><label className="form-label">First Name *</label><input className="form-control" value={qaFirst} onChange={e=>setQaFirst(e.target.value)}/></div>
                <div className="form-group"><label className="form-label">Last Name *</label><input className="form-control" value={qaLast} onChange={e=>setQaLast(e.target.value)}/></div>
                <div className="form-group"><label className="form-label">Phone</label><input className="form-control" value={qaPhone} onChange={e=>setQaPhone(e.target.value)}/></div>
              </div>
              <div style={{display:'flex',gap:8}}><button className="btn btn-primary" onClick={quickAddClient}>Create &amp; Use</button><button className="btn btn-outline" onClick={()=>setShowQuickAdd(false)}>Cancel</button></div>
            </div>
          )}
        </div>
      ):(
        <div>
          <div className="alert alert-info mb-3" style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:8}}><span>👤 <strong>{selectedClient.firstName} {selectedClient.lastName}</strong>{selectedClient.phone?` · ${selectedClient.phone}`:''}{(selectedClient.pets||[]).length?` · Pets on file: ${selectedClient.pets.map(p=>p.name).join(', ')}`:''}</span><button className="btn btn-sm btn-outline" onClick={()=>setSelectedClient(null)}>Change</button></div>

          <div style={{fontWeight:700,fontSize:14,color:'var(--navy)',marginBottom:8}}>Items Requested</div>
          {items.map(it=>(
            <div key={it.id} style={{border:'1.5px solid var(--gray-200)',borderRadius:'var(--radius)',padding:10,marginBottom:8}}>
              <div className="grid-3" style={{marginBottom:8}}>
                <div className="form-group" style={{margin:0}}><label className="form-label">Pet</label><input className="form-control" list={`pets-${selectedClient.id}`} value={it.petName} onChange={e=>updateItem(it.id,'petName',e.target.value)} placeholder="Pet name"/><datalist id={`pets-${selectedClient.id}`}>{(selectedClient.pets||[]).map(p=><option key={p.id} value={p.name}/>)}</datalist></div>
                <div className="form-group" style={{margin:0}}><label className="form-label">Animal</label><select className="form-control" value={it.animalType} onChange={e=>updateItem(it.id,'animalType',e.target.value)}>{ANIMAL_TYPES.map(t=><option key={t}>{t}</option>)}</select></div>
                <div className="form-group" style={{margin:0}}><label className="form-label">Category</label><select className="form-control" value={it.category} onChange={e=>updateItem(it.id,'category',e.target.value)}>{getCatsForAnimal(it.animalType).map(c=><option key={c}>{c}</option>)}</select></div>
              </div>
              <div style={{display:'flex',gap:8,alignItems:'flex-end',flexWrap:'wrap'}}>
                <div className="form-group" style={{margin:0,flex:1,minWidth:180}}><label className="form-label">Details (wet vs dry, brand, size…)</label><input className="form-control" value={it.description} onChange={e=>updateItem(it.id,'description',e.target.value)} placeholder="e.g. wet food, chicken flavor"/></div>
                <div className="form-group" style={{margin:0,width:100}}><label className="form-label">Approx Qty</label><input type="number" min="0" className="form-control" value={it.qtyRequested} onChange={e=>updateItem(it.id,'qtyRequested',e.target.value)}/></div>
                <button className="btn btn-sm btn-danger" onClick={()=>removeItem(it.id)} disabled={items.length===1}>✕</button>
              </div>
            </div>
          ))}
          <button className="btn btn-outline mb-3" onClick={addItem}>+ Add Another Item</button>

          <div className="grid-3">
            <div className="form-group"><label className="form-label">Requested Date</label><input type="date" className="form-control" value={reqDate} onChange={e=>setReqDate(e.target.value)}/></div>
            <div className="form-group"><label className="form-label">Method</label><select className="form-control" value={method} onChange={e=>setMethod(e.target.value)}>{REQUEST_METHODS.map(m=><option key={m}>{m}</option>)}</select></div>
            <div className="form-group"><label className="form-label">Taken By</label><input className="form-control" value={createdBy} onChange={e=>setCreatedBy(e.target.value)} placeholder="Your name"/></div>
          </div>
          <div className="form-group"><label className="form-label">Notes</label><textarea className="form-control" rows={2} value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Anything else the coordinator should know…"/></div>

          <div style={{display:'flex',justifyContent:'flex-end',gap:10,marginTop:8}}>
            <button className="btn btn-outline" onClick={onClose}>Cancel</button>
            <button className="btn btn-primary btn-lg" onClick={save} disabled={saving}>{saving?'Saving…':'📝 Save Request'}</button>
          </div>
        </div>
      )}
    </Modal>
  );
}

function FulfillRequest({request,client,products,inventory,setInventory,distributions,setDistributions,requests,setRequests,onDone,onCancel}){
  const [items,setItems]=useState([]);
  const [upcInput,setUpcInput]=useState('');
  const [search,setSearch]=useState('');
  const [notes,setNotes]=useState(request.notes||'');
  const [pickupDate,setPickupDate]=useState(today());
  const [confirm,setConfirm]=useState(false);
  const upcRef=useRef(null);
  const inv=useMemo(()=>{const m={};inventory.forEach(i=>m[i.productId]=i.qty);return m;},[inventory]);
  const prodMap=useMemo(()=>{const m={};products.forEach(p=>m[p.id]=p);return m;},[products]);

  function addByProduct(p){const existing=items.findIndex(i=>i.productId===p.id);if(existing>=0){setItems(prev=>prev.map((it,i)=>i===existing?{...it,qty:it.qty+1}:it));}else{setItems(prev=>[...prev,{id:uid(),productId:p.id,qty:1}]);}}
  function addByUPC(){const code=upcInput.trim();if(!code)return;const prod=products.find(p=>p.upc===code);if(!prod){alert('Product not found in master. Please add it first.');return;}addByProduct(prod);setUpcInput('');upcRef.current?.focus();}

  async function complete(){
    if(items.length===0){alert('Attach at least one product.');return;}
    for(const item of items){if((inv[item.productId]||0)<item.qty){const p=prodMap[item.productId];alert(`Insufficient stock for ${p?.name}. Only ${inv[item.productId]||0} available.`);return;}}
    const dist={id:uid(),clientId:request.clientId,date:pickupDate,notes:notes||`Fulfilled request from ${fmtDate(request.date)}`,items:items.map(i=>({productId:i.productId,qty:i.qty,notes:''}))};
    const updates={};items.forEach(i=>{updates[i.productId]=(updates[i.productId]||0)+i.qty;});
    await setInventory(prev=>prev.map(i=>updates[i.productId]!==undefined?{...i,qty:i.qty-updates[i.productId]}:i));
    await setDistributions(prev=>[dist,...prev]);
    await setRequests(prev=>prev.map(r=>r.id===request.id?{...r,status:'fulfilled',fulfilledAt:new Date().toISOString(),distributionId:dist.id}:r));
    setConfirm(false);
    alert(`Request fulfilled for ${client?client.firstName+' '+client.lastName:'client'}! ✅`);
    onDone();
  }

  return(
    <div className="page">
      <div className="section-header mb-4"><div><div className="section-title">📦 Fulfill Request</div><div className="text-sm text-muted">{client?`${client.firstName} ${client.lastName}`:'Unknown Client'} · Requested {fmtDate(request.date)}</div></div><div style={{display:'flex',gap:8}}><button className="btn btn-outline" onClick={onCancel}>← Back</button><button className="btn btn-success btn-lg" onClick={()=>setConfirm(true)} disabled={items.length===0}>✅ Complete &amp; Update Inventory</button></div></div>

      <div className="card mb-4"><div className="card-header"><span className="card-title">🗒 What Was Requested</span></div>
        <div style={{display:'grid',gap:6}}>{request.items.map((it,idx)=>(<div key={idx} style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap',fontSize:13}}>{animalBadge(it.animalType)}<span className="font-bold">{it.category}</span>{it.petName&&<span className="text-muted">for {it.petName}</span>}{it.description&&<span className="text-muted">— {it.description}</span>}{it.qtyRequested?<span className="text-muted">(~{it.qtyRequested})</span>:null}</div>))}</div>
        {request.notes&&<div className="text-sm text-muted mt-2">📝 {request.notes}</div>}
      </div>

      <div className="grid-2 mb-4">
        <div className="form-group"><label className="form-label">Fulfillment Date</label><input type="date" className="form-control" value={pickupDate} onChange={e=>setPickupDate(e.target.value)}/></div>
        <div className="form-group"><label className="form-label">Notes</label><input className="form-control" value={notes} onChange={e=>setNotes(e.target.value)}/></div>
      </div>

      <div className="upc-bar mb-4"><span style={{color:'var(--gold)',fontWeight:700,fontSize:15}}>📡 Scan Item</span><input ref={upcRef} className="upc-input" placeholder="Scan UPC to attach a product…" value={upcInput} onChange={e=>setUpcInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addByUPC()} autoFocus/><button className="btn btn-gold" onClick={addByUPC}>Add</button></div>

      <div className="grid-2">
        <div className="card"><div className="card-header"><span className="card-title">Attached Products ({items.length})</span></div>{items.length===0&&<div className="text-sm text-muted">No products attached yet. Scan or pick from inventory.</div>}{items.map(item=>{const p=prodMap[item.productId];const avail=inv[item.productId]||0;return(<div key={item.id} className="batch-line"><div style={{flex:1}}><div className="font-bold text-sm">{p?.name}</div><div className="text-xs text-muted">{p?.brand} · Available: {avail}</div></div><div className="qty-controls"><button className="qty-btn" onClick={()=>setItems(prev=>prev.map(i=>i.id===item.id?{...i,qty:Math.max(1,i.qty-1)}:i))}>−</button><input className="qty-num form-control" type="number" min={1} max={avail} value={item.qty} onChange={e=>setItems(prev=>prev.map(i=>i.id===item.id?{...i,qty:Math.min(avail,parseInt(e.target.value)||1)}:i))}/><button className="qty-btn" onClick={()=>setItems(prev=>prev.map(i=>i.id===item.id?{...i,qty:Math.min(avail,i.qty+1)}:i))}>+</button></div><button className="btn btn-sm btn-danger" onClick={()=>setItems(prev=>prev.filter(i=>i.id!==item.id))}>✕</button></div>);})}</div>
        <div className="card"><div className="card-header"><span className="card-title">Available Inventory</span></div><input className="form-control mb-3" placeholder="Filter products…" value={search} onChange={e=>setSearch(e.target.value)}/><div style={{maxHeight:320,overflowY:'auto'}}>{products.filter(p=>{const q=search.toLowerCase();return (!q||(p.name+p.brand).toLowerCase().includes(q))&&(inv[p.id]||0)>0;}).map(p=>(<div key={p.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'7px 0',borderBottom:'1px solid var(--gray-100)',cursor:'pointer'}} onClick={()=>addByProduct(p)}><div><div className="text-sm font-bold">{p.name}</div><div className="text-xs text-muted">{p.animalType} · {p.category}</div></div><div style={{display:'flex',gap:8,alignItems:'center'}}><span className="text-sm text-muted">{inv[p.id]} avail.</span><button className="btn btn-sm btn-outline">+ Add</button></div></div>))}</div></div>
      </div>
      <ConfirmModal show={confirm} message={`Complete this request? ${items.length} item types, ${items.reduce((s,i)=>s+i.qty,0)} total units. Inventory will be updated immediately.`} onConfirm={complete} onCancel={()=>setConfirm(false)}/>
    </div>
  );
}

// ── REPORTS ───────────────────────────────────────────────────────────────────
function Reports({products,inventory,batches,distributions,clients}){
  const [report,setReport]=useState('impact');const [dateFrom,setDateFrom]=useState('');const [dateTo,setDateTo]=useState('');const [filterType,setFilterType]=useState('All');const [filterClient,setFilterClient]=useState('');
  const inv=useMemo(()=>{const m={};inventory.forEach(i=>m[i.productId]=i.qty);return m;},[inventory]);
  const prodMap=useMemo(()=>{const m={};products.forEach(p=>m[p.id]=p);return m;},[products]);
  const clientMap=useMemo(()=>{const m={};clients.forEach(c=>m[c.id]=c);return m;},[clients]);
  function inRange(dateStr){if(dateFrom&&dateStr<dateFrom)return false;if(dateTo&&dateStr>dateTo)return false;return true;}
  const REPORTS=[{id:'impact',label:'🐾 Community Impact'},{id:'by-client',label:'👤 By Client'},{id:'distributions',label:'🛍 Distribution History'},{id:'donations',label:'📥 Donations Received'},{id:'inventory',label:'📦 Inventory'},{id:'low',label:'⚠️ Low Stock'},{id:'out',label:'🚫 Out of Stock'},{id:'cat',label:'🐱 Cat Supplies'},{id:'dog',label:'🐶 Dog Supplies'},{id:'other',label:'🐾 Other Animals'}];

  function ImpactReport(){
    const filteredDists=distributions.filter(d=>inRange(d.date));
    const householdsServed=new Set(filteredDists.map(d=>d.clientId)).size;
    const totalVisits=filteredDists.length;
    const activeClientIds=new Set(filteredDists.map(d=>d.clientId));
    const activePets=clients.filter(c=>activeClientIds.has(c.id)).flatMap(c=>c.pets||[]);
    const catCount=activePets.filter(p=>p.animalType==='Cat').length;
    const dogCount=activePets.filter(p=>p.animalType==='Dog').length;
    const otherCount=activePets.filter(p=>p.animalType==='Other').length;
    const totalPets=activePets.length;
    const unitsByType={Cat:0,Dog:0,Other:0};const unitsByCategory={};
    filteredDists.forEach(d=>{d.items.forEach(item=>{const p=prodMap[item.productId];if(p){unitsByType[p.animalType]=(unitsByType[p.animalType]||0)+item.qty;const key=`${p.animalType} — ${p.category}`;unitsByCategory[key]=(unitsByCategory[key]||0)+item.qty;}});});
    const totalUnits=Object.values(unitsByType).reduce((s,v)=>s+v,0);
    const filteredBatches=batches.filter(b=>b.status==='finalized'&&inRange(b.date));
    const totalReceived=filteredBatches.reduce((s,b)=>s+b.items.reduce((ss,i)=>ss+i.qty,0),0);
    const statBox=(val,label,sub,color)=>(<div style={{background:'var(--white)',borderRadius:'var(--radius-lg)',padding:'20px',boxShadow:'var(--shadow)',borderTop:`4px solid ${color}`,textAlign:'center'}}><div style={{fontSize:32,fontWeight:900,color}}>{val}</div><div style={{fontWeight:700,fontSize:14,color:'var(--navy)',marginTop:4}}>{label}</div>{sub&&<div style={{fontSize:12,color:'var(--gray-400)',marginTop:2}}>{sub}</div>}</div>);
    return(<div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(150px,1fr))',gap:14,marginBottom:24}}>{statBox(householdsServed,'Households Served','unique families','var(--navy)')}{statBox(totalVisits,'Total Visits','pickup sessions','var(--blue)')}{statBox(totalPets,'Pets Helped','across all families','var(--gold)')}{statBox(totalUnits,'Units Distributed','items given out','var(--green)')}{statBox(totalReceived,'Units Received','donated items','var(--orange)')}</div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:20}}>
        <div className="card"><div className="card-header"><span className="card-title">🐾 Animals Helped</span></div>
          {catCount>0&&<div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px 0',borderBottom:'1px solid var(--gray-100)'}}><div style={{display:'flex',alignItems:'center',gap:10}}><span style={{fontSize:24}}>🐱</span><div><div className="font-bold">Cats</div><div className="text-xs text-muted">{catCount} cat{catCount!==1?'s':''}</div></div></div><div style={{textAlign:'right'}}><div style={{fontSize:24,fontWeight:900,color:'#7d3c98'}}>{catCount}</div><div style={{fontSize:11,color:'var(--gray-400)'}}>{unitsByType.Cat||0} units given</div></div></div>}
          {dogCount>0&&<div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px 0',borderBottom:'1px solid var(--gray-100)'}}><div style={{display:'flex',alignItems:'center',gap:10}}><span style={{fontSize:24}}>🐶</span><div><div className="font-bold">Dogs</div><div className="text-xs text-muted">{dogCount} dog{dogCount!==1?'s':''}</div></div></div><div style={{textAlign:'right'}}><div style={{fontSize:24,fontWeight:900,color:'#a04000'}}>{dogCount}</div><div style={{fontSize:11,color:'var(--gray-400)'}}>{unitsByType.Dog||0} units given</div></div></div>}
          {otherCount>0&&<div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px 0'}}><div style={{display:'flex',alignItems:'center',gap:10}}><span style={{fontSize:24}}>🐾</span><div><div className="font-bold">Other Animals</div><div className="text-xs text-muted">birds, small animals, etc.</div></div></div><div style={{textAlign:'right'}}><div style={{fontSize:24,fontWeight:900,color:'#1a6b3a'}}>{otherCount}</div><div style={{fontSize:11,color:'var(--gray-400)'}}>{unitsByType.Other||0} units given</div></div></div>}
          {totalPets===0&&<div className="text-sm text-muted">No pickups in selected date range.</div>}
        </div>
        <div className="card"><div className="card-header"><span className="card-title">📦 Units Distributed by Category</span></div>{Object.entries(unitsByCategory).sort((a,b)=>b[1]-a[1]).map(([cat,qty])=>(<div key={cat} style={{display:'flex',justifyContent:'space-between',padding:'7px 0',borderBottom:'1px solid var(--gray-100)'}}><span className="text-sm">{cat}</span><span className="font-bold text-sm">{qty}</span></div>))}{Object.keys(unitsByCategory).length===0&&<div className="text-sm text-muted">No distributions in range.</div>}</div>
      </div>
      {totalVisits>0&&<div className="alert alert-info" style={{fontSize:15,lineHeight:1.7}}><strong>📋 Summary:</strong> During this period, the DELC Pet Pantry served <strong>{householdsServed} household{householdsServed!==1?'s':''}</strong> across <strong>{totalVisits} visit{totalVisits!==1?'s':''}</strong>, providing support for <strong>{totalPets} pet{totalPets!==1?'s':''}</strong>{catCount>0?` including ${catCount} cat${catCount!==1?'s':''}`:''}{dogCount>0?`, ${dogCount} dog${dogCount!==1?'s':''}`:''}{otherCount>0?`, and ${otherCount} other animal${otherCount!==1?'s':''}`:''}.  A total of <strong>{totalUnits} unit{totalUnits!==1?'s':''}</strong> of pet supplies were distributed.</div>}
    </div>);
  }

  function ByClientReport(){
    const filtered=clients.filter(c=>{if(filterClient&&!(c.firstName+' '+c.lastName).toLowerCase().includes(filterClient.toLowerCase()))return false;const hasDist=distributions.some(d=>d.clientId===c.id&&inRange(d.date));return hasDist||!filterClient;});
    return(<div><input className="form-control mb-3" placeholder="Filter by client name…" value={filterClient} onChange={e=>setFilterClient(e.target.value)}/><div className="table-wrap"><table><thead><tr><th>Client</th><th>Pets</th><th>Animal Types</th><th>Visits</th><th>Last Visit</th><th>Total Units</th><th>Top Item</th></tr></thead><tbody>{filtered.length===0&&<tr><td colSpan={7}><div className="empty-state" style={{padding:20}}><h3>No clients match</h3></div></td></tr>}{filtered.map(c=>{const cDists=distributions.filter(d=>d.clientId===c.id&&inRange(d.date));const visits=cDists.length;const totalUnits=cDists.reduce((s,d)=>s+d.items.reduce((ss,i)=>ss+i.qty,0),0);const lastVisit=cDists[0]?.date;const pets=c.pets||[];const animalTypes=[...new Set(pets.map(p=>p.animalType))];const itemCounts={};cDists.forEach(d=>d.items.forEach(i=>{itemCounts[i.productId]=(itemCounts[i.productId]||0)+i.qty;}));const topPid=Object.entries(itemCounts).sort((a,b)=>b[1]-a[1])[0]?.[0];const topProd=topPid?prodMap[topPid]:null;return(<tr key={c.id}><td><div className="font-bold">{c.firstName} {c.lastName}</div><div className="text-xs text-muted">{c.phone||c.email||''}</div></td><td>{pets.length}</td><td><div style={{display:'flex',gap:4,flexWrap:'wrap'}}>{animalTypes.map(t=><span key={t} className={`badge ${t==='Cat'?'badge-cat':t==='Dog'?'badge-dog':'badge-other'}`}>{t==='Cat'?'🐱':t==='Dog'?'🐶':'🐾'} {t}</span>)}{animalTypes.length===0&&<span className="text-muted text-xs">None on file</span>}</div></td><td className="font-bold">{visits}</td><td>{lastVisit?fmtDate(lastVisit):'—'}</td><td className="font-bold">{totalUnits}</td><td className="text-sm">{topProd?topProd.name:'—'}</td></tr>);})}</tbody></table></div></div>);
  }

  function renderReport(){
    switch(report){
      case 'impact': return <ImpactReport/>;
      case 'by-client': return <ByClientReport/>;
      case 'inventory':{const rows=products.filter(p=>filterType==='All'||p.animalType===filterType);return(<table><thead><tr><th>Product</th><th>Brand</th><th>Animal</th><th>Category</th><th>UPC</th><th>Qty</th><th>Status</th></tr></thead><tbody>{rows.map(p=><tr key={p.id}><td>{p.name}</td><td>{p.brand||'—'}</td><td>{p.animalType}</td><td>{p.category}</td><td>{p.upc||'—'}</td><td className="font-bold">{inv[p.id]||0}</td><td>{stockBadge(inv[p.id]||0)}</td></tr>)}</tbody></table>);}
      case 'donations':{const rows=batches.filter(b=>b.status==='finalized'&&inRange(b.date));return(<table><thead><tr><th>Date</th><th>Donor</th><th>Products</th><th>Units</th><th>Notes</th></tr></thead><tbody>{rows.map(b=><tr key={b.id}><td>{fmtDate(b.date)}</td><td>{b.donor||'Anonymous'}</td><td>{b.items.length}</td><td>{b.items.reduce((s,i)=>s+i.qty,0)}</td><td>{b.notes||'—'}</td></tr>)}</tbody></table>);}
      case 'distributions':{const rows=distributions.filter(d=>inRange(d.date)&&(filterClient===''||clients.find(c=>c.id===d.clientId&&(c.firstName+' '+c.lastName).toLowerCase().includes(filterClient.toLowerCase()))));return(<table><thead><tr><th>Date</th><th>Client</th><th>Animals</th><th>Items</th><th>Units</th><th>Notes</th></tr></thead><tbody>{rows.map(d=>{const cl=clientMap[d.clientId];const pets=cl?.pets||[];return(<tr key={d.id}><td>{fmtDate(d.date)}</td><td className="font-bold">{cl?`${cl.firstName} ${cl.lastName}`:'Unknown'}</td><td><div style={{display:'flex',gap:3,flexWrap:'wrap'}}>{[...new Set(pets.map(p=>p.animalType))].map(t=><span key={t} className={`badge ${t==='Cat'?'badge-cat':t==='Dog'?'badge-dog':'badge-other'}`} style={{fontSize:10}}>{t==='Cat'?'🐱':t==='Dog'?'🐶':'🐾'}</span>)}</div></td><td>{d.items.length}</td><td>{d.items.reduce((s,i)=>s+i.qty,0)}</td><td className="text-sm text-muted">{d.notes||'—'}</td></tr>);})}</tbody></table>);}
      case 'low':{const rows=products.filter(p=>{const q=inv[p.id]||0;return q>0&&q<=LOW_STOCK_THRESHOLD;});return(<table><thead><tr><th>Product</th><th>Animal</th><th>Category</th><th>Qty</th></tr></thead><tbody>{rows.map(p=><tr key={p.id}><td>{p.name}</td><td>{animalBadge(p.animalType)}</td><td>{p.category}</td><td><span className="badge badge-low">{inv[p.id]}</span></td></tr>)}</tbody></table>);}
      case 'out':{const rows=products.filter(p=>(inv[p.id]||0)===0);return(<table><thead><tr><th>Product</th><th>Animal</th><th>Category</th><th>UPC</th></tr></thead><tbody>{rows.map(p=><tr key={p.id}><td>{p.name}</td><td>{animalBadge(p.animalType)}</td><td>{p.category}</td><td>{p.upc||'—'}</td></tr>)}</tbody></table>);}
      case 'cat':case 'dog':case 'other':{const type=report==='cat'?'Cat':report==='dog'?'Dog':'Other';const rows=products.filter(p=>p.animalType===type);return(<table><thead><tr><th>Product</th><th>Brand</th><th>Category</th><th>Size</th><th>On Hand</th><th>Status</th></tr></thead><tbody>{rows.map(p=><tr key={p.id}><td>{p.name}</td><td>{p.brand||'—'}</td><td>{p.category}</td><td>{p.size||'—'}</td><td className="font-bold">{inv[p.id]||0}</td><td>{stockBadge(inv[p.id]||0)}</td></tr>)}</tbody></table>);}
      default: return null;
    }
  }

  function exportReport(){
    let rows=[],cols=[];
    switch(report){
      case 'inventory':cols=[{key:'name',label:'Product'},{key:'brand',label:'Brand'},{key:'animalType',label:'Animal'},{key:'category',label:'Category'},{key:'upc',label:'UPC'},{key:'qty',label:'Qty'},{key:'status',label:'Status'}];rows=products.filter(p=>filterType==='All'||p.animalType===filterType).map(p=>({name:p.name,brand:p.brand||'',animalType:p.animalType,category:p.category,upc:p.upc||'',qty:inv[p.id]||0,status:(inv[p.id]||0)===0?'Out of Stock':(inv[p.id]||0)<=LOW_STOCK_THRESHOLD?'Low Stock':'In Stock'}));break;
      case 'donations':cols=[{key:'date',label:'Date'},{key:'donor',label:'Donor'},{key:'products',label:'Products'},{key:'units',label:'Units'},{key:'notes',label:'Notes'}];rows=batches.filter(b=>b.status==='finalized'&&inRange(b.date)).map(b=>({date:b.date,donor:b.donor||'Anonymous',products:b.items.length,units:b.items.reduce((s,i)=>s+i.qty,0),notes:b.notes||''}));break;
      case 'distributions':cols=[{key:'date',label:'Date'},{key:'client',label:'Client'},{key:'items',label:'Items'},{key:'units',label:'Units'},{key:'notes',label:'Notes'}];rows=distributions.filter(d=>inRange(d.date)).map(d=>{const cl=clientMap[d.clientId];return{date:d.date,client:cl?`${cl.firstName} ${cl.lastName}`:'Unknown',items:d.items.length,units:d.items.reduce((s,i)=>s+i.qty,0),notes:d.notes||''};});break;
      case 'by-client':cols=[{key:'name',label:'Client'},{key:'pets',label:'Pets'},{key:'types',label:'Animal Types'},{key:'visits',label:'Visits'},{key:'units',label:'Total Units'},{key:'lastVisit',label:'Last Visit'}];rows=clients.map(c=>{const cDists=distributions.filter(d=>d.clientId===c.id&&inRange(d.date));return{name:`${c.firstName} ${c.lastName}`,pets:(c.pets||[]).length,types:[...new Set((c.pets||[]).map(p=>p.animalType))].join(', '),visits:cDists.length,units:cDists.reduce((s,d)=>s+d.items.reduce((ss,i)=>ss+i.qty,0),0),lastVisit:cDists[0]?.date||''};}).filter(r=>r.visits>0||!filterClient);break;
      default: return;
    }
    if(rows.length) exportCSV(rows,cols,'DELC_PetPantry_'+report+'_'+today());
  }

  const showDateFilter=['donations','distributions','by-client','impact'].includes(report);
  const showTypeFilter=['inventory','cat','dog','other','low','out'].includes(report);
  const showClientFilter=['distributions','by-client'].includes(report);
  return(
    <div className="page">
      <div className="section-header mb-4"><div className="section-title">📊 Reports</div><button className="btn btn-outline" onClick={exportReport}>📥 Export CSV</button></div>
      <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:16}}>{REPORTS.map(r=>(<button key={r.id} className={`btn ${report===r.id?'btn-primary':'btn-outline'}`} style={{fontSize:13}} onClick={()=>setReport(r.id)}>{r.label}</button>))}</div>
      <div className="report-filter-bar">
        {showDateFilter&&<><div className="form-group" style={{margin:0,flex:1}}><label className="form-label">From Date</label><input type="date" className="form-control" value={dateFrom} onChange={e=>setDateFrom(e.target.value)}/></div><div className="form-group" style={{margin:0,flex:1}}><label className="form-label">To Date</label><input type="date" className="form-control" value={dateTo} onChange={e=>setDateTo(e.target.value)}/></div></>}
        {showTypeFilter&&<div className="form-group" style={{margin:0,flex:1}}><label className="form-label">Animal Type</label><select className="form-control" value={filterType} onChange={e=>setFilterType(e.target.value)}><option>All</option>{ANIMAL_TYPES.map(t=><option key={t}>{t}</option>)}</select></div>}
        {showClientFilter&&<div className="form-group" style={{margin:0,flex:2}}><label className="form-label">Filter by Client</label><input className="form-control" placeholder="Type client name…" value={filterClient} onChange={e=>setFilterClient(e.target.value)}/></div>}
        <button className="btn btn-outline" onClick={()=>{setDateFrom('');setDateTo('');setFilterType('All');setFilterClient('');}}>Clear</button>
      </div>
      <div className={report==='impact'||report==='by-client'?'':'table-wrap'}>{renderReport()}</div>
    </div>
  );
}
